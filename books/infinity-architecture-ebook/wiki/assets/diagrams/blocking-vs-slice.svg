<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img" aria-label="阻塞式 Agent 与 Infinity 无阻塞切片对比">
<title>阻塞式 Agent 与 Infinity 无阻塞切片对比</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--amber)"/></marker><marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--forest)"/></marker></defs>
<text x="10" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--amber)" text-anchor="start">传统阻塞模型：等待期间进程、栈与连接全程常驻</text><rect x="10" y="28" width="620" height="88" rx="4" fill="none" stroke="var(--amber)" stroke-width="1" stroke-dasharray="4 3"/><rect x="22" y="42" width="138" height="60" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="32" y="61" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="start">LLM 轮次 1</text><text x="32" y="78" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">决定调用 CI 构建</text><text x="32" y="94" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">占用常驻任务栈</text><line x1="160" y1="72" x2="192" y2="72" stroke="var(--amber)" stroke-width="1.2" marker-end="url(#arrow-amber)"/><rect x="194" y="42" width="246" height="60" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="204" y="61" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="var(--amber)" text-anchor="start">阻塞等待工具返回 (20 分钟+)</text><text x="204" y="78" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">stdio/HTTP 会话不能断</text><text x="204" y="94" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">Lambda 超时、空闲内存无法回收</text><line x1="440" y1="72" x2="472" y2="72" stroke="var(--amber)" stroke-width="1.2" marker-end="url(#arrow-amber)"/><rect x="474" y="42" width="144" height="60" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="484" y="61" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="start">LLM 轮次 2</text><text x="484" y="78" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">继续消费结果</text><text x="484" y="94" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">期间始终按时长计费</text><text x="10" y="146" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--forest)" text-anchor="start">Infinity 无阻塞切片模型：派发即让出，等待期间纯数据休眠</text><rect x="10" y="156" width="620" height="148" rx="4" fill="none" stroke="var(--forest)" stroke-width="1.2"/><rect x="22" y="170" width="174" height="72" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="32" y="189" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="var(--forest)" text-anchor="start">切片 1 (Slice)</text><text x="32" y="206" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">加载历史 -&gt; 模型流式输出</text><text x="32" y="222" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">先 sync() 落盘再 POST</text><text x="32" y="238" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">收到 200 ACK 立即退出</text><line x1="196" y1="206" x2="226" y2="206" stroke="var(--forest)" stroke-width="1.2" marker-end="url(#arrow-forest)"/><rect x="228" y="170" width="184" height="72" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="238" y="189" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="start">休眠期 (0 驻留任务)</text><text x="238" y="206" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">仅存历史与状态表</text><text x="238" y="222" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">无进程、无栈、无长连接</text><text x="238" y="238" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">本地退驱动 / Lambda 缩零</text><line x1="412" y1="206" x2="442" y2="206" stroke="var(--forest)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-forest)"/><rect x="444" y="170" width="174" height="72" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="454" y="189" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="var(--forest)" text-anchor="start">切片 2 (新唤醒)</text><text x="454" y="206" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">RAP 回调 POST -&gt; 入队</text><text x="454" y="222" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">按 group_id 重载历史</text><text x="454" y="238" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">去重匹配后继续下一轮</text><text x="22" y="268" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">单线程串行与多线程并发由队列层 group_id (SQS FIFO / 本地 mpsc 路由) 保障，运行时无需分布式锁。</text><text x="22" y="288" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--forest)" text-anchor="start">实测基准 (agent_scale.rs): 80,000 个空闲 Agent 共占约 8.4 GB RSS，约 102 KiB/Agent。</text>
</svg>
