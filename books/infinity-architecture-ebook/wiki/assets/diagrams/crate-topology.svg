<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" width="640" height="416" role="img" aria-label="Infinity 21 个 Crate 的五层依赖版图">
<title>Infinity 21 个 Crate 的五层依赖版图</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--amber)"/></marker><marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--forest)"/></marker></defs>
<text x="10" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">21 个 Workspace Crate 的五层依赖版图 (自顶向下调用)</text><rect x="10" y="30" width="620" height="58" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="20" y="49" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--forest)" text-anchor="start">交互前端与部署外壳 (5 Crates)</text><text x="20" y="66" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">infinity-agent-cli (TUI/ACP) · infinity-daemon · infinity-agent-lambda · slack-bot · slack-dataflow</text><text x="20" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">面向终端、桌面 Web、Zed/ACP、AWS Lambda 与 Slack 的运行宿主</text><line x1="320" y1="88" x2="320" y2="102" stroke="var(--line)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="10" y="102" width="620" height="58" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="20" y="121" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--amber)" text-anchor="start">核心切片运行时 (2 Crates)</text><text x="20" y="138" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">infinity-agent-core (event_processor / HistoryManager / local router &amp; driver) · infinity-mdtests</text><text x="20" y="154" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">全部状态机、三阶段缓冲、线程树、位置索引压缩与单线程 Actor 调度</text><line x1="320" y1="160" x2="320" y2="174" stroke="var(--line)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="10" y="174" width="620" height="58" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="20" y="193" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">工具桥接与标准 RAP 服务 (6 Crates)</text><text x="20" y="210" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">rap-client · infinity-rap-bridge · infinity-mcp-bridge · steering-server · github-poller · test-servers</text><text x="20" y="226" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">统一回调转换 prepare_callback、MCP JSON-RPC 适配、规则扫描与 GitHub 订阅轮询</text><line x1="320" y1="232" x2="320" y2="246" stroke="var(--line)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="10" y="246" width="620" height="58" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="20" y="265" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">堆叠沙箱子系统 (3 Crates)</text><text x="20" y="282" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">sandbox-core (SandboxBackend/ModeProvider) · sandbox-local (jj/git + bwrap) · sandbox-remote (EFS)</text><text x="20" y="298" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">按线程隔离工作区、命令流式输出、OS 写隔离、审批弹窗与 git bundle 跨机迁移</text><line x1="320" y1="304" x2="320" y2="318" stroke="var(--line)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="10" y="318" width="620" height="58" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="20" y="337" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--forest)" text-anchor="start">底层线缆协议与模型供应 (5 Crates)</text><text x="20" y="354" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">rap-protocol (类型化 ID) · infinity-protocol (ThreadRef) · provider-protocol (ErrorClass) · bedrock · rig</text><text x="20" y="370" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">跨进程与跨网络稳定契约：strkind 强类型 ID、Unix Socket 供应器与结构化错误分类</text><text x="10" y="402" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="400" fill="var(--muted)" text-anchor="start">辅助 TS 子项目: agent/ (AWS CDK 部署栈) · infinity-ui/ (共享 React 组件) · infinity-web/ (Vite 桌面端)</text>
</svg>
