<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" role="img" aria-label="MRTR 无状态多往返追问与沙箱外 OAuth 2.1 授权流程">
<title>MRTR 无状态多往返追问与沙箱外 OAuth 2.1 授权流程</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
  </marker>
</defs>
<text x="12" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">无粘性会话的 MRTR 追问与沙箱外 OAuth 2.1 授权边界</text><rect x="12" y="32" width="190" height="74" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="22" y="52" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">1. Host / MCP Client</text><text x="22" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">持有 OAuth 2.1 Token</text><text x="22" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">(按 RFC 8707 绑定 aud)</text><text x="22" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">发起 tools/call (id=1)</text><line x1="202" y1="69" x2="232" y2="69" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="234" y="32" width="190" height="74" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="244" y="52" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">2. Replica A (无状态)</text><text x="244" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">校验 Token 与 Scope</text><text x="244" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">需人工确认或外部授权</text><text x="244" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">签发 AEAD requestState</text><line x1="424" y1="69" x2="454" y2="69" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="456" y="32" width="192" height="74" rx="4" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="466" y="52" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--amber)" text-anchor="start">3. InputRequiredResult</text><text x="466" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">resultType: input_required</text><text x="466" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">inputRequests: elicitation</text><text x="466" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">附带不透明 requestState</text><line x1="552" y1="106" x2="552" y2="134" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="336" y="136" width="312" height="76" rx="4" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="346" y="156" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--amber)" text-anchor="start">4. 人工确认或 URL Mode 带外授权</text><text x="346" y="174" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">Form Mode: 宿主弹窗采集非敏感字段</text><text x="346" y="190" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">URL Mode: 跳浏览器直连服务端，密钥不经 LLM</text><text x="346" y="206" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">服务端核对 sub 身份，防钓鱼与会话劫持</text><line x1="336" y1="174" x2="306" y2="174" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="136" width="292" height="76" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="22" y="156" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">5. 重试落地到任意 Replica B (id=2)</text><text x="22" y="174" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">原样回传 requestState 与 inputResponses</text><text x="22" y="190" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">Replica B 验签: principal + TTL + paramsDigest</text><text x="22" y="206" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">无需粘性路由即可返回 resultType: complete</text><text x="12" y="234" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="var(--muted)" text-anchor="start">安全红线: 沙箱内代码绝不接触原始 API Key; URL Mode 敏感凭证绝不回流到 MCP Client 或模型上下文。</text>
</svg>