<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 194" width="540" height="194" role="img" aria-label="查询改写、HyDE 与 HyPE 的对齐路径对比">
<title>查询改写、HyDE 与 HyPE 的对齐路径对比</title>
<defs><marker id="arr-query-routing" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--muted)"/></marker></defs>
<text x="10" y="14" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">用户口语问法如何对齐到规范术语（三条路径对比）</text><rect x="10" y="26" width="118" height="122" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="20" y="43" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">原始用户问题</text><text x="20" y="59" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">同一个通知来了</text><text x="20" y="73" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">两次还会不会</text><text x="20" y="87" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">重复发货？</text><text x="20" y="101" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">保留原始限定条件</text><line x1="128" y1="46" x2="152" y2="46" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-query-routing)"/><line x1="128" y1="88" x2="152" y2="88" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-query-routing)"/><line x1="128" y1="130" x2="152" y2="130" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-query-routing)"/><rect x="152" y="24" width="198" height="42" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="162" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">1. 查询改写与拆解（查询时）</text><text x="162" y="57" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">补充术语并拆子问题，双路按 ID 合并</text><rect x="152" y="72" width="198" height="42" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="162" y="89" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">2. HyDE 假设文档（查询时）</text><text x="162" y="105" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">先写假设段落再搜原文，严禁当证据</text><rect x="152" y="120" width="198" height="42" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="162" y="137" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">3. HyPE 问题代理（入库时）</text><text x="162" y="153" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">入库预生问题向量，命中回映射父块</text><line x1="350" y1="45" x2="376" y2="78" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-query-routing)"/><line x1="350" y1="93" x2="376" y2="93" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-query-routing)"/><line x1="350" y1="141" x2="376" y2="108" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-query-routing)"/><rect x="376" y="56" width="154" height="72" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="386" y="73" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">真实授权原文</text><text x="386" y="89" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">callback-v2:0</text><text x="386" y="103" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">callback-v2:1</text><text x="386" y="117" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">按 parent_id 去重</text><text x="10" y="182" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start">HyDE 消耗查询时延迟；HyPE 把生成成本前移到入库，文档更新时代理必须同步重建。</text>
</svg>