<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" aria-labelledby="branch-store-title branch-store-desc" style="font-family:'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"><title id="branch-store-title">状态沿分支重放，外部文件独立演化</title><desc id="branch-store-desc">从早期节点分叉时不继承另一条分支上的 store 写入，但文件系统副作用脱离会话分支单独存在。</desc><defs><marker id="branch-store-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--brand, #1B365D)"/></marker></defs><rect width="960" height="456" rx="6" fill="var(--paper, #faf9f5)"/><path d="M280 205 H312 Q320 205 320 197 V113 Q320 105 328 105 H360" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#branch-store-arrow)"/><path d="M280 237 H300 Q308 237 308 245 V319 Q308 327 316 327 H360" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#branch-store-arrow)"/><path d="M600 105 H680" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#branch-store-arrow)"/><path d="M600 327 H680" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#branch-store-arrow)"/><rect x="40" y="174" width="240" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="160.0" y="208" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">共同历史</text><text x="160.0" y="245" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">store: inspected = 1</text><rect x="360" y="62" width="240" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="480.0" y="96" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">分支 A 成功</text><text x="480.0" y="133" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">store: inspected = 2</text><rect x="680" y="62" width="240" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="800.0" y="96" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">继续 A</text><text x="800.0" y="133" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">load 得到 2</text><rect x="360" y="284" width="240" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="480.0" y="318" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">分支 B</text><text x="480.0" y="355" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">从共同历史分叉</text><rect x="680" y="284" width="240" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="800.0" y="318" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">继续 B</text><text x="800.0" y="355" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">load 得到 1</text><text x="40" y="426" font-size="16" fill="var(--muted, #5e5d57)">分支 A 写出的文件在切回分支 B 后保持原样；脚本失败跳过 store 提交，也不撤销已写入文件。</text></svg>