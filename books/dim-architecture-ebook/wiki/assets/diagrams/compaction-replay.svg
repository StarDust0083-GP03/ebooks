<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 268" width="420" height="268" role="img" aria-label="上下文压缩、SHA-256 恢复快照与回退重放">
<title>上下文压缩、SHA-256 恢复快照与回退重放</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">持久摘要事实与可丢弃快照分离：加速失败永不丢失已完成摘要</text><rect x="8" y="24" width="192" height="56" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="16" y="39.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.1" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">1. context/prepare</text><text x="16" y="53.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">固定本次 through 截点与历史前缀</text><text x="16" y="65.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">预算超限时在准备内触发压缩</text><text x="16" y="78.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">单飞追踪，支持 stop/steer 取消</text><line x1="200" y1="52" x2="220" y2="52" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="220" y="24" width="192" height="56" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="228" y="39.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.1" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">2. context/compaction（权威）</text><text x="228" y="53.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">随原子批次落盘并发布</text><text x="228" y="65.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">含 cursor、summary 与基线</text><text x="228" y="78.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">不可变事实，不内嵌恢复快照</text><line x1="316" y1="80" x2="316" y2="102" stroke="var(--forest)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="8" y="102" width="404" height="56" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="16" y="117.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.1" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">3. RecoverySnapshot（可丢弃派生缓存 · timeline_snapshots）</text><text x="16" y="131.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">解释器 dim/context-projection/v4 编码 ProjectionCheckpoint + SHA-256 摘要</text><text x="16" y="143.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">锚定已发布的 completed 压缩事件，记录 resume 事件位置与此前折叠状态</text><text x="16" y="156.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">构建或保存失败只打告警，不回滚摘要事实，也不重跑模型压缩</text><line x1="110" y1="158" x2="110" y2="182" stroke="var(--forest)" stroke-width="1.05" marker-end="url(#arrow)"/><line x1="310" y1="158" x2="310" y2="182" stroke="var(--amber)" stroke-width="1.05" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="8" y="182" width="194" height="58" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="16" y="197.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.1" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">校验通过：增量续读</text><text x="16" y="211.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">验证锚点、摘要与 resume 位置</text><text x="16" y="223.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">从 resume 起分页折叠后续事实</text><text x="16" y="236.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">跳过压缩前大段历史与请求正文</text><rect x="218" y="182" width="194" height="58" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="226" y="197.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.1" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">缺失 / 损坏 / 越界：安全回退</text><text x="226" y="211.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">自动忽略异常快照，不吞存储错误</text><text x="226" y="223.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">从祖先链起点完整重放事实</text><text x="226" y="236.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">仍采用已提交的 compaction 摘要</text><text x="8" y="256" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.1" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">上下文输入只有两条合法通道：已采用的输入（input/consumed）与工具结果。</text>
</svg>