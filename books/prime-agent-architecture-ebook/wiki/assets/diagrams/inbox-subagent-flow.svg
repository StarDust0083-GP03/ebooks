<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 294" width="480" height="294" role="img" aria-label="持久信箱 rlm.inbox 与核家族消息投递链路">
<title>持久信箱 rlm.inbox 与核家族消息投递链路</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">机器通知不再直接塞满上下文：持久信箱与合并唤醒链路</text><rect x="8" y="24" width="144" height="170" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="17" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">六类异步事件源</text><text x="17" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">1. bash-done (后台命令)</text><text x="17" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">2. factory-progress (工厂)</text><text x="17" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">3. agent-message (核家族)</text><text x="17" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">4. child-exited (子完成)</text><text x="17" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">5. child-failed (子失败)</text><text x="17" y="121" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">6. heartbeat (周期心跳)</text><text x="17" y="134" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   同 job 仅留最新一封</text><rect x="174" y="24" width="150" height="86" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="183" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">SessionInbox 存储</text><text x="183" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">inbox.jsonl 仅追加日志</text><text x="183" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">断写重放 + 单调递增 ID</text><text x="183" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">写失败显式降级内存态</text><text x="183" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">已回收 bash 自动撤回</text><rect x="174" y="126" width="150" height="68" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="183" y="143" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">合并唤醒与提醒行</text><text x="183" y="158" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">inbox:arrival 短通知行</text><text x="183" y="171" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">inbox:reminder 周期提醒</text><text x="183" y="184" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">只报数量, 不塞全量正文</text><rect x="346" y="24" width="126" height="86" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="355" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">rlm.inbox.read()</text><text x="355" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">支持 4 个过滤字段:</text><text x="355" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">sender / class /</text><text x="355" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">sinceMs / beforeMs</text><text x="355" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">未知字段严格报错</text><rect x="346" y="126" width="126" height="68" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="355" y="143" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">python_repl 卡片</text><text x="355" y="158" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">emit 专有 MIME 帧</text><text x="355" y="171" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">逐条还原信箱消息</text><text x="355" y="184" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">清空后自动撤回提醒</text><line x1="152" y1="68" x2="174" y2="68" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="249" y1="110" x2="249" y2="126" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="324" y1="68" x2="346" y2="68" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="409" y1="110" x2="409" y2="126" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><polyline points="346,160 335,160 335,160 324,160" fill="none" stroke="var(--amber)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="8" y="212" width="464" height="52" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="17" y="229" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">家族通信与防伪造边界</text><text x="17" y="244" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">agent_message.send 仅限 parent / sibling / child，优先 Worker 点对点直连，失败回退 Supervisor 转发</text><text x="17" y="257" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">inbox_notice 与 inbox:arrival/reminder 保留键由 Daemon 内部直插，客户端伪造输入直接拒绝</text><text x="8" y="282" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">全局开关 agentInbox.enabled: false 可回退直插模式；无 Daemon 的 -p 模式不启用信箱。</text>
</svg>