<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 374" width="480" height="374" role="img" aria-label="Prime Agent 十个 Rust Crate 与双层进程拓扑">
<title>Prime Agent 十个 Rust Crate 与双层进程拓扑</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">单向依赖（上层指向下层）与进程隔离边界</text><rect x="8" y="22" width="224" height="48" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="17" y="39" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">pa-cli (组合根)</text><text x="17" y="54" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">prime-agent 二进制、参数解析、模式分发</text><rect x="248" y="22" width="224" height="48" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="257" y="39" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">pa-tui (终端界面)</text><text x="257" y="54" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">仅依赖 pa-types，零引擎耦合，首帧无阻塞</text><line x1="232" y1="46" x2="248" y2="46" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="8" y="88" width="464" height="128" rx="4" fill="none" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="5 3"/><text x="16" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.5" font-weight="600" fill="var(--amber)" text-anchor="start" opacity="1">pa-daemon 进程托管层（本地 Socket / 直接挂载 Ticket / ACP stdio）</text><rect x="16" y="110" width="146" height="94" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="25" y="127" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Supervisor 守护进程</text><text x="25" y="142" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">监听 Unix Socket/Pipe</text><text x="25" y="155" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">管理 Worker 退避重启</text><text x="25" y="168" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">维护 RLM 账本与名册</text><text x="25" y="181" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">90s 热更新排空事务</text><rect x="176" y="110" width="142" height="94" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="185" y="127" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Worker 进程 (每会话)</text><text x="185" y="142" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">承载 pa-core 会话引擎</text><text x="185" y="155" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">append-only JSONL 落盘</text><text x="185" y="168" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">信箱 inbox.jsonl 管理</text><text x="185" y="181" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">事件流 50ms 合并广播</text><rect x="332" y="110" width="132" height="94" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="341" y="127" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">CPython REPL 内核</text><text x="341" y="142" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">python -m rlm.repl</text><text x="341" y="155" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">单事件循环 + __main__</text><text x="341" y="168" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">bash/rlm/mcp/skills</text><text x="341" y="181" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">dill v2 快照恢复</text><line x1="162" y1="156" x2="176" y2="156" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="318" y1="156" x2="332" y2="156" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="120" y1="70" x2="88" y2="110" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="360" y1="70" x2="248" y2="110" stroke="var(--muted)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="8" y="234" width="148" height="52" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="17" y="251" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">pa-core (会话引擎)</text><text x="17" y="266" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">提示词、压缩、精炼、MCP</text><text x="17" y="279" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">工具注册、内核管理、门禁</text><rect x="166" y="234" width="148" height="52" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="175" y="251" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">pa-agent + pa-ai</text><text x="175" y="266" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">Turn 循环、三层队列</text><text x="175" y="279" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">多供应商流式适配</text><rect x="324" y="234" width="148" height="52" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="333" y="251" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">pa-models + telemetry</text><text x="333" y="266" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">模型目录缓存与回退</text><text x="333" y="279" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">异步无阻塞埋点上报</text><line x1="247" y1="204" x2="82" y2="234" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="8" y="302" width="332" height="42" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="17" y="319" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">pa-types (唯一共享词表)</text><text x="17" y="334" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">线协议帧、会话条目、AI 消息、目标与信箱类型，零工作区上游依赖</text><rect x="350" y="302" width="122" height="42" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="359" y="319" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">pa-perf (仅 CI)</text><text x="359" y="334" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">PTY 基准与语料回放</text><line x1="82" y1="286" x2="120" y2="302" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="240" y1="286" x2="210" y2="302" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="398" y1="286" x2="290" y2="302" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><text x="8" y="362" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">注：unsafe_code = forbid 覆盖全工作区；pa-tui 只消费 pa-types 帧，不链接 pa-core。</text>
