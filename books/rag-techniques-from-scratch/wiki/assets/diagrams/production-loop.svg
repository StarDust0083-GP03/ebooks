<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 208" width="540" height="208" role="img" aria-label="生产环境权限、版本快照与评估回归回路">
<title>生产环境权限、版本快照与评估回归回路</title>
<defs><marker id="arr-production-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--muted)"/></marker></defs>
<text x="10" y="14" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">生产运行回路：权限、版本、评估与升级门禁</text><rect x="10" y="26" width="162" height="66" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="20" y="43" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">全路径访问控制</text><text x="20" y="59" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">会话认证非请求自报</text><text x="20" y="73" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">检索 / 邻域 / 代理 / 缓存</text><text x="20" y="87" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">统一继承 scope 与版本</text><line x1="172" y1="59" x2="192" y2="59" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-production-loop)"/><rect x="192" y="26" width="162" height="66" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="202" y="43" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">版本化快照与清理</text><text x="202" y="59" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">新索引校验后原子切换</text><text x="202" y="73" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">删文同步清向量与摘要</text><text x="202" y="87" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">缓存键绑定版本与权限</text><line x1="354" y1="59" x2="374" y2="59" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-production-loop)"/><rect x="374" y="26" width="156" height="66" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="384" y="43" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">超时预算与故障隔离</text><text x="384" y="59" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">总时限向下分配阶段</text><text x="384" y="73" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">区分无资料与依赖故障</text><text x="384" y="87" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">注入文本视为不可信数据</text><line x1="452" y1="92" x2="452" y2="116" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-production-loop)"/><rect x="192" y="116" width="338" height="60" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="202" y="133" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">固定题集回归 + 升级烟雾门禁</text><text x="202" y="149" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">追踪 candidate vs delivery Recall 与完整性</text><text x="202" y="163" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">模型停服 / 框架大版本升级先过离线回归与语法 CI</text><line x1="192" y1="146" x2="91" y2="146" stroke="var(--muted)" stroke-width="1.15" stroke-dasharray="4 3" marker-end="url(#arr-production-loop)"/><line x1="91" y1="146" x2="91" y2="92" stroke="var(--muted)" stroke-width="1.15" stroke-dasharray="4 3" marker-end="url(#arr-production-loop)"/><text x="18" y="134" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="var(--muted)" text-anchor="start">失败样本回流</text><text x="18" y="148" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="400" fill="var(--muted)" text-anchor="start">定位再改一层</text><text x="10" y="196" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start">上线后的故障多半不在检索公式，而在权限漏检、派生残留、模型停服或超时级联。</text>
</svg>