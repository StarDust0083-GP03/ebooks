<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" role="img" aria-label="RAP 响应式工具协议全链路与五类回调分流">
<title>RAP 响应式工具协议全链路与五类回调分流</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--amber)"/></marker><marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--forest)"/></marker></defs>
<text x="10" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">RAP 响应式工具协议全链路：断连回调、订阅分流与 MCP 兼容</text><rect x="10" y="34" width="196" height="116" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="20" y="53" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--forest)" text-anchor="start">Agent Runtime</text><text x="20" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">1. GET /.well-known/rap-toolset</text><text x="20" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">2. POST /invoke (带 callback_url)</text><text x="20" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">3. 收到 2xx 即让出并休眠</text><text x="20" y="118" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">4. RapNotifier 生命周期通知:</text><text x="20" y="134" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">   /close_thread /cancel /migrate</text><rect x="242" y="34" width="188" height="116" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="252" y="53" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--amber)" text-anchor="start">独立 RAP 工具服务</text><text x="252" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">立即返回 HTTP 200 ACK</text><text x="252" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">后台执行长任务或维护订阅</text><text x="252" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">如 sandbox-local / github-poller</text><text x="252" y="118" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">完成后主动 POST callback_url</text><text x="252" y="134" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">不绑定 Agent 进程存活周期</text><rect x="462" y="34" width="168" height="116" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="472" y="53" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">MCP 兼容桥接</text><text x="472" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">infinity-mcp-bridge</text><text x="472" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">懒初始化 Stdio / HTTP</text><text x="472" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">JSON-RPC 2.0 + SSE</text><text x="472" y="118" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">维护 mcp-session-id</text><text x="472" y="134" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">对核心暴露统一 Tool</text><line x1="206" y1="68" x2="242" y2="68" stroke="var(--forest)" stroke-width="1.2" marker-end="url(#arrow-forest)"/><text x="224" y="60" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="8.5" font-weight="600" fill="var(--forest)" text-anchor="middle">POST</text><line x1="242" y1="102" x2="206" y2="102" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/><text x="224" y="116" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.5" font-weight="600" fill="var(--amber)" text-anchor="middle">回调</text><line x1="430" y1="88" x2="462" y2="88" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><line x1="336" y1="150" x2="336" y2="178" stroke="var(--amber)" stroke-width="1.2" marker-end="url(#arrow-amber)"/><text x="346" y="168" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--amber)" text-anchor="start">prepare_callback (Daemon 与 Lambda 共用)</text><rect x="10" y="180" width="620" height="102" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="20" y="199" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start">五类 RapCallback 回调的统一分流</text><text x="20" y="216" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">tool_result        -&gt; InputMessage (支持多模态 content + display_as + subscription 标记)</text><text x="20" y="232" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">subscription_event -&gt; 默认自动派生隔离事件子线程；associative: true 内联注入；final: true 清理订阅</text><text x="20" y="248" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">user_choice / oauth -&gt; 经 PrepareResult 透传给 TUI/Web/Slack，不污染模型对话历史</text><text x="20" y="264" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">view_update        -&gt; 旁路显示通道 (如 diff 面板)，Daemon 转发前端，Lambda 接收后直接丢弃</text>
</svg>
