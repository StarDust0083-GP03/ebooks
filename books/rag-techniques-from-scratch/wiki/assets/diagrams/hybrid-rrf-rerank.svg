<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 192" width="540" height="192" role="img" aria-label="混合检索、RRF 身份对齐与重排链路">
<title>混合检索、RRF 身份对齐与重排链路</title>
<defs><marker id="arr-hybrid-rrf-rerank" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--muted)"/></marker></defs>
<text x="10" y="14" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">多路召回 → 按稳定 ID 融合 → 有限候选池重排</text><rect x="10" y="26" width="126" height="52" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="20" y="43" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">BM25 词面召回</text><text x="20" y="59" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">擅长接口名与错误码</text><text x="20" y="73" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">返回 ID 排序表 A</text><rect x="10" y="90" width="126" height="52" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="20" y="107" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">稠密向量召回</text><text x="20" y="123" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">擅长同义与口语问法</text><text x="20" y="137" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">返回 ID 排序表 B</text><line x1="136" y1="52" x2="162" y2="74" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-hybrid-rrf-rerank)"/><line x1="136" y1="116" x2="162" y2="92" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-hybrid-rrf-rerank)"/><rect x="162" y="42" width="154" height="86" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="172" y="59" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">按 chunk.id 融合</text><text x="172" y="75" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">每路先去重再计名次</text><text x="172" y="89" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">score += 1 / (c + rank)</text><text x="172" y="103" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">禁止按数组下标相加</text><line x1="316" y1="85" x2="336" y2="85" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-hybrid-rrf-rerank)"/><rect x="336" y="42" width="102" height="86" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="346" y="59" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">重排器</text><text x="346" y="75" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">Cross-Encoder</text><text x="346" y="89" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">或结构化 LLM</text><text x="346" y="103" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">仅重排候选池</text><line x1="438" y1="85" x2="456" y2="85" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-hybrid-rrf-rerank)"/><rect x="456" y="42" width="74" height="86" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="466" y="59" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">交付</text><text x="466" y="75" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">Top-k</text><text x="466" y="89" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">预算打包</text><text x="466" y="103" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">证据完整</text><text x="10" y="164" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--amber)" text-anchor="start">关键边界：重排无法补回从未进入候选池的证据；多条件问题不能只留单条最高分。</text><text x="10" y="180" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="400" fill="var(--muted)" text-anchor="start">静态核对提示：上游 fusion_retrieval.ipynb 存在按数组位置合并风险，上线务必按 ID 对齐。</text>
</svg>