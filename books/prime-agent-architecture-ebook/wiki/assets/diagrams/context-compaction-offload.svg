<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 328" width="480" height="328" role="img" aria-label="RLM 变量卸载与上下文自动压缩机制">
<title>RLM 变量卸载与上下文自动压缩机制</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">为什么 RLM 长程不失速：变量卸载 + 带底线的安全压缩</text><rect x="8" y="24" width="224" height="84" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="17" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">传统多工具线性历史</text><text x="17" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">每次 read/grep/bash 原文回填上下文</text><text x="17" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">大输出反复参与后续每轮注意力计算</text><text x="17" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">上下文很快触顶，被迫高频粗粒度总结</text><text x="17" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">中间分析状态随摘要丢失，只能重读</text><rect x="248" y="24" width="224" height="84" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="257" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Prime Agent (RLM 变量卸载)</text><text x="257" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">大文件/结果绑定到 REPL 命名变量</text><text x="257" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">仅向模型回传切片、统计或 Head-Tail 摘要</text><text x="257" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">压缩只折叠对话消息，REPL 内存继续存活</text><text x="257" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">超出 16 MiB 单变量在压缩时定向裁剪</text><rect x="8" y="126" width="464" height="96" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="17" y="143" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">自动压缩触发阈值公式 (pa-core/src/session_engine/compaction.rs)</text><text x="17" y="158" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">1. 比例目标: requested = context_window * threshold_percent (默认 95%)</text><text x="17" y="171" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">2. 保留底线: retention_floor = keep_recent(20,000) + 2 * reserve(16,384) + 1</text><text x="17" y="184" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   防止过低百分比导致每轮工具调用都反复重摘要</text><text x="17" y="197" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">3. 联合上限: combined = context_window - max_output - max(reserve, 4,096)</text><text x="17" y="210" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">4. 生效阈值: threshold = min(max(requested, retention_floor), combined)</text><rect x="8" y="240" width="146" height="58" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="17" y="257" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">压缩执行</text><text x="17" y="272" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">保留近期 20k tokens</text><text x="17" y="285" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">写入 compactionSummary</text><text x="17" y="298" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">触发内核 &gt;16MiB 裁剪</text><rect x="167" y="240" width="146" height="58" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="176" y="257" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">冷边界重注</text><text x="176" y="272" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">刷新 [harness-digest]</text><text x="176" y="285" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">发送 ipython_state 通知</text><text x="176" y="298" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">历史可用 session.messages</text><rect x="326" y="240" width="146" height="58" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="335" y="257" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">目标与自主续跑</text><text x="335" y="272" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">活跃 Goal 注入续跑行</text><text x="335" y="285" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">质量门禁检验工作树快照</text><text x="335" y="298" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">压缩后精炼顺延至空闲点</text><line x1="240" y1="222" x2="81" y2="240" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="154" y1="269" x2="167" y2="269" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="313" y1="269" x2="326" y2="269" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><text x="8" y="316" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">Token 估算采用保守 chars/4 向上取整；视频与图片块分别按固定估算值计入。</text>
</svg>