<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 266" width="660" height="266" role="img" aria-label="Harness 作为 MCP Server 的协作模型与四重安全边界">
<title>Harness 作为 MCP Server 的协作模型与四重安全边界</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
  </marker>
</defs>
<text x="12" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">把 Harness 暴露为 MCP Server 的多代理协作与四重安全边界</text><rect x="12" y="34" width="304" height="116" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="22" y="54" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">Harness-as-MCP-Server 编排平面</text><text x="22" y="72" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">子代理执行 -&gt; MCP Tasks (异步句柄 + 轮询)</text><text x="22" y="88" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">共享 Swarm Board -&gt; 类型化 Tools (发发现/认领)</text><text x="22" y="104" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">协作者唤醒 -&gt; MCP Events (任务终态或新进展)</text><text x="22" y="120" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">设计铁律: 常规 SaaS 暴露工具，而非单一 ask_agent</text><line x1="316" y1="92" x2="342" y2="92" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="344" y="34" width="304" height="116" rx="4" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="354" y="54" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--amber)" text-anchor="start">纵深安全四重攻击面与防线</text><text x="354" y="72" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">1. Untrusted Webhook: 验 HMAC + 防 SSRF + 隔离</text><text x="354" y="88" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">2. Code Mode 沙箱: 无磁盘凭证，OAuth 由宿主管</text><text x="354" y="104" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">3. MCP Apps iframe: 受限沙箱 + CSP + 审计 RPC</text><text x="354" y="120" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">4. 本地安装 SEP-1024: 完整命令展示 + 显式同意</text><rect x="12" y="168" width="636" height="62" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="22" y="188" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">2027 尚未完全闭合的三大工程缺口</text><text x="22" y="206" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">发现层: 摆脱多注册表重复提交 -&gt; Server Cards + /.well-known/ai-catalog.json + 自动安全扫描</text><text x="22" y="222" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">可观测性: 服务端看不到完整对话 -&gt; 规范化 telemetry.intent 与反馈工具，兼顾最小上下文隔离原则</text><text x="12" y="250" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="var(--muted)" text-anchor="start">同一套原语向下接业务系统、向上做多代理协作，但每新增一种扩展面就必须配套对应信任边界。</text>
</svg>