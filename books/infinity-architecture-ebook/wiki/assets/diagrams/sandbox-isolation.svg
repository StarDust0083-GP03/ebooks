<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-label="堆叠沙箱与操作系统级写隔离边界">
<title>堆叠沙箱与操作系统级写隔离边界</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--amber)"/></marker><marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--forest)"/></marker></defs>
<text x="10" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">堆叠沙箱工作区与操作系统级写隔离边界</text><rect x="10" y="34" width="620" height="48" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="20" y="53" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--forest)" text-anchor="start">宿主仓库工作目录 (默认只读，永不直接改写)</text><text x="20" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">沙箱落在 {repo}/.infinity/.sandboxes/，并注入 GIT_CEILING_DIRECTORIES 防止 git 越界识别外层仓</text><line x1="320" y1="82" x2="320" y2="108" stroke="var(--forest)" stroke-width="1.2" marker-end="url(#arrow-forest)"/><rect x="195" y="110" width="250" height="48" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="205" y="129" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--amber)" text-anchor="start">父线程沙箱 sandbox-{root}</text><text x="205" y="146" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">jj workspace add / git worktree add</text><line x1="260" y1="158" x2="162" y2="188" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="380" y1="158" x2="478" y2="188" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><text x="156" y="174" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="middle">base_thread_id 堆叠</text><text x="484" y="174" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="middle">并行独立工作区</text><rect x="26" y="190" width="266" height="56" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="36" y="209" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start">子线程 A: sandbox-{c1}</text><text x="36" y="226" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">独立修改单测，互不覆盖</text><text x="36" y="242" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">完成后 squash_sandbox 合并回父书签</text><rect x="348" y="190" width="266" height="56" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="358" y="209" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start">子线程 B: sandbox-{c2}</text><text x="358" y="226" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">独立修改文档，互不覆盖</text><text x="358" y="242" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">完成后 squash_sandbox 合并回父书签</text><rect x="10" y="266" width="620" height="92" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="20" y="285" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--amber)" text-anchor="start">OS 写隔离层 (sandbox-local) 与越权审批</text><text x="20" y="302" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">Linux:  bwrap --ro-bind / / --bind &lt;tmp&gt; --bind &lt;sandbox&gt; --dev /dev --proc /proc (缺少时 build.rs 编译)</text><text x="20" y="318" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">macOS:  sandbox-exec (allow default) (deny file-write*) + 仅放行沙箱、TMPDIR、sccache 与 /dev/null</text><text x="20" y="334" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">提权写: 请求 write-orig 或 write:/path 时沿 thread_ancestors 查授权，未授权发 RAP UserChoice 确认</text><text x="20" y="350" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="400" fill="var(--muted)" text-anchor="start">边界声明: 读文件系统与网络默认开放，目标防止误改宿主工作区，并非对抗恶意代码的虚拟化容器</text>
</svg>
