<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 208" width="540" height="208" role="img" aria-label="字符切分失真与结构感知邻域扩展对比">
<title>字符切分失真与结构感知邻域扩展对比</title>
<defs><marker id="arr-chunking-boundary" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--muted)"/></marker></defs>
<text x="10" y="14" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--amber)" text-anchor="start">方式 A：纯字符切分（拆散规则与表格）</text><rect x="10" y="22" width="162" height="54" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="20" y="39" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">Chunk 1（被截断）</text><text x="20" y="55" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">先验签，再核对金额</text><text x="20" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">表 1：支付事件对照</text><rect x="182" y="22" width="168" height="54" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="192" y="39" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">Chunk 2（丢失表头）</text><text x="192" y="55" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">| pay.succeeded | 核对</text><text x="192" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">回调幂等以渠道流水号...</text><rect x="360" y="22" width="170" height="54" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="370" y="39" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">典型故障</text><text x="370" y="55" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">表格与标题拆在两块</text><text x="370" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">验签和幂等只召回一半</text><line x1="10" y1="90" x2="530" y2="90" stroke="var(--line)" stroke-width="0.7"/><text x="10" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--forest)" text-anchor="start">方式 B：结构感知切分 + 小块召回 + 边界邻域扩展</text><rect x="10" y="116" width="162" height="60" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="20" y="133" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">表组原子块</text><text x="20" y="149" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">caption + table 绑定</text><text x="20" y="163" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">OCR 4.1 blocks 标签</text><rect x="182" y="116" width="168" height="60" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="192" y="133" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">小块精确召回</text><text x="192" y="149" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">callback-v2:0（验签）</text><text x="192" y="163" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">带章节检索标题</text><line x1="350" y1="146" x2="366" y2="146" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-chunking-boundary)"/><rect x="366" y="116" width="164" height="60" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="376" y="133" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">受控邻域补全</text><text x="376" y="149" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">同 doc_id + 同 version</text><text x="376" y="163" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">再次校验 ACL 与预算</text><text x="10" y="196" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start">块是召回单位，不必等同阅读单位；跨权限或跨版本的相邻块绝不拼进同一窗口。</text>
</svg>