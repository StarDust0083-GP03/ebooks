<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 242" width="420" height="242" role="img" aria-label="四种标识与共享专家的线程隔离边界">
<title>四种标识与共享专家的线程隔离边界</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="11" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="start">共享专家只开放使用权，不开放私人线程与配置权</text><rect x="8" y="22" width="114" height="48" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="17" y="38" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">用户 A (owner)</text><text x="17" y="52.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">user_id = 7</text><text x="17" y="64.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">可读写配置与对话</text><rect x="8" y="86" width="114" height="48" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="17" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">用户 B (shared)</text><text x="17" y="116.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">user_id = 9</text><text x="17" y="128.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">可用专家，不可改配置</text><rect x="148" y="48" width="112" height="60" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="157" y="64" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">共享专家</text><text x="157" y="78.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">agent_id = research</text><text x="157" y="90.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">owner = 7, shared = 1</text><text x="157" y="103.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">require_agent_row()</text><line x1="122" y1="46" x2="148" y2="66" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="122" y1="110" x2="148" y2="90" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="286" y="20" width="126" height="48" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="295" y="36" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--ink)" text-anchor="start">私有线程 thread-A</text><text x="295" y="50.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">user=7, contributed=0</text><text x="295" y="62.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">仅 owner 可见</text><rect x="286" y="78" width="126" height="48" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="295" y="94" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--ink)" text-anchor="start">共享对话 thread-S</text><text x="295" y="108.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">user=7, contributed=1</text><text x="295" y="120.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">thread_visible_to() 放行</text><rect x="286" y="136" width="126" height="48" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="295" y="152" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--ink)" text-anchor="start">用户 B 线程 thread-B</text><text x="295" y="166.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">user=9, contributed=0</text><text x="295" y="178.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">独立 session_key 绑定</text><line x1="260" y1="68" x2="286" y2="44" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="260" y1="78" x2="286" y2="102" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="260" y1="92" x2="286" y2="160" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="8" y1="198" x2="412" y2="198" stroke="var(--line)" stroke-width="0.7"/><text x="8" y="214" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="8.4" font-weight="400" fill="var(--ink)" text-anchor="start">session_key 格式：&lt;agent_id&gt;:dashboard:&lt;user_id&gt;:dm（入口绑定可变）</text><text x="8" y="230" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--amber)" text-anchor="start">鉴权顺序：1. JWT → 2. require_agent_row → 3. resolve_thread_id / thread_visible_to</text>
</svg>