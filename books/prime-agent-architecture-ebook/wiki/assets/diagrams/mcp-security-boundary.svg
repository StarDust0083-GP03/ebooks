<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 282" width="480" height="282" role="img" aria-label="MCP 桥接职责划分与安全信任边界">
<title>MCP 桥接职责划分与安全信任边界</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">MCP 宿主/内核切分与真实安全边界（进程隔离 ≠ 安全沙箱）</text><rect x="8" y="24" width="224" height="118" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="17" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Rust 宿主侧 (pa-core/src/mcp + skills)</text><text x="17" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 凭据存储与 OAuth 2.0 (RFC 9728 + PKCE)</text><text x="17" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 本地回调端口 + 令牌刷新</text><text x="17" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 响应 mcp.config / mcp.refresh / login</text><text x="17" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 仓库级技能 (SourceScope::Project)</text><text x="17" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">  禁止自动导入内核，只作 Markdown 文档</text><text x="17" y="121" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 目录查询响应不返回原始凭据</text><rect x="248" y="24" width="224" height="118" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="257" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Python 内核侧 (rlm/mcp.py + 外部服务)</text><text x="257" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 启动 stdio 或连接 Streamable HTTP MCP</text><text x="257" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 子进程仅透传 _SAFE_ENV 基础变量</text><text x="257" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• tools/list 分页上限 25 页防卡死</text><text x="257" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 关闭超时 2.5s (严于宿主 5s 强杀线)</text><text x="257" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• stderr 限 8 KiB / 40 行并正则脱敏</text><text x="257" y="121" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• mcp.call_tool 原样透传实时结果</text><line x1="232" y1="66" x2="248" y2="66" stroke="var(--forest)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="248" y1="102" x2="232" y2="102" stroke="var(--muted)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="8" y="160" width="464" height="92" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="17" y="177" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">操作系统权限现实（README.md 明确声明的边界）</text><text x="17" y="192" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">1. Worker 与 Python 内核以当前用户权限运行模型生成的 Python 代码与 bash() 命令</text><text x="17" y="205" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">2. 进程隔离只解决生命周期回收与故障恢复，不构成恶意代码或提示词注入的安全沙箱</text><text x="17" y="218" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">3. 自主质量门禁的 Git 快照已禁用 fsmonitor/钩子/外部 diff，但 .gitattributes 过滤器仍无法关闭</text><text x="17" y="231" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">4. 处理不可信仓库或指令时，必须在外部容器、虚拟机或云端沙箱中隔离运行</text><text x="8" y="270" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">Rust 全工作区开启 unsafe_code = forbid；密钥不进埋点（pa-telemetry 仅发基础类型）。</text>
</svg>