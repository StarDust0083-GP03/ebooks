<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 368" width="420" height="368" role="img" aria-label="时间总线写入、落盘与按序派发链路">
<title>时间总线写入、落盘与按序派发链路</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">写入与分发分离：已提交（热窗口）不等于已发布（已落盘）</text><rect x="8" y="22" width="404" height="42" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="16" y="37.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">1. append / append_batch_registered</text><text x="16" y="51.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">能力提交 EventDraft，核心禁止扩展写入 13 个 RESERVED_DOMAINS</text><line x1="210" y1="64" x2="210" y2="76" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="8" y="76" width="404" height="42" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="16" y="91.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">2. before 同步变形链（提交锁内，仅 Rust）</text><text x="16" y="105.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">逐个变换草稿并记录 TraceStep；任意钩子报错则回退原草稿提交</text><line x1="210" y1="118" x2="210" y2="130" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="8" y="130" width="404" height="42" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="16" y="145.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">3. 分配单调 sequence + 登记回调</text><text x="16" y="159.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">写锁内登记关联状态；登记失败整批中止，不留脏锚点</text><line x1="210" y1="172" x2="210" y2="184" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="8" y="184" width="404" height="42" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="16" y="199.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">4. 热窗口暂存 + SQLite WAL 写入轮</text><text x="16" y="213.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">synchronous=FULL（macOS 开 fullfsync）；输出行按 20ms 节流合批</text><line x1="210" y1="226" x2="210" y2="238" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="8" y="238" width="404" height="42" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="16" y="253.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">5. 推进发布水位 published()</text><text x="16" y="267.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">落盘返回后推进水位；外部读取与 Dispatcher 只消费已发布事件</text><line x1="210" y1="280" x2="210" y2="292" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="8" y="292" width="404" height="42" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="16" y="307.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">6. Dispatcher 严格按序派发</text><text x="16" y="321.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">订阅方经 consume() 先暂存再重建，只处理高于截点的实时事实</text><text x="8" y="356" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--forest)" text-anchor="start" opacity="1">副作用发生在总线外：重启与重载按同一协议从截点重建，绝不重放外部动作。</text>
</svg>