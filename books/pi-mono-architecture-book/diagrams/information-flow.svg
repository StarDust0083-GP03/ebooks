<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" role="img" aria-labelledby="information-flow-title information-flow-desc" style="font-family:'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"><title id="information-flow-title">把信息筛选移到执行侧</title><desc id="information-flow-desc">普通工具结果直接进入模型上下文；Code Mode 在执行侧完成组合与筛选，只交回选中输出。</desc><defs><marker id="information-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--brand, #1B365D)"/></marker></defs><rect width="960" height="444" rx="6" fill="var(--paper, #faf9f5)"/><path d="M212 112 H270" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#information-flow-arrow)"/><path d="M452 112 H510" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#information-flow-arrow)"/><path d="M692 112 H750" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#information-flow-arrow)"/><path d="M180 332 H210" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#information-flow-arrow)"/><path d="M370 332 H400" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#information-flow-arrow)"/><path d="M560 332 H590" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#information-flow-arrow)"/><path d="M750 332 H780" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#information-flow-arrow)"/><rect x="30" y="74" width="182" height="76" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="121.0" y="118.0" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">模型选择工具</text><rect x="270" y="74" width="182" height="76" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="361.0" y="118.0" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d