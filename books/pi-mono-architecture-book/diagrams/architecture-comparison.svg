<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" role="img" aria-labelledby="architecture-comparison-title architecture-comparison-desc" style="font-family:'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"><title id="architecture-comparison-title">v0.9.4 与 v1.6.0 普通 CLI 的分层对照</title><desc id="architecture-comparison-desc">v0.9.4 的循环位于 ai 包；v1.6.0 由 AgentSession 管理会话，agent 包拥有循环，ai 专注协议接入与流式解析，pi-schema 承担统一校验。</desc><defs><marker id="architecture-comparison-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--brand, #1B365D)"/></marker></defs><rect width="960" height="544" rx="6" fill="var(--paper, #faf9f5)"/><path d="M232 164 V232" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#architecture-comparison-arrow)"/><path d="M232 318 V386" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#architecture-comparison-arrow)"/><path d="M728 164 V232" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#architecture-comparison-arrow)"/><path d="M728 318 V386" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#architecture-comparison-arrow)"/><rect x="64" y="78" width="336" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="232.0" y="112" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">编码应用</text><text x="232.0" y="149" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">旧版 main / TUI</text><rect x="64" y="232" width="336" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="232.0" y="266" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">Agent + Transport</text><text x="232.0" y="303" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">状态与传输抽象</text><rect x="64" y="386" width="336" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="232.0" y="420" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">ai：循环与模型接入</text><text x="232.0" y="457" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">工具循环位于 ai 包内</text><rect x="560" y="78" width="336" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="728.0" y="112" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">AgentSession / 资源 / 扩展</text><text x="728.0" y="149" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">树形会话、诊断去重与上下文投影</text><rect x="560" y="232" width="336" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="728.0" y="266" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">agent：Agent 与工具循环</text><text x="728.0" y="303" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">默认并行与通用嵌套契约</text><rect x="560" y="386" width="336" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="728.0" y="420" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">ai + pi-schema</text><text x="728.0" y="457" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">多提供商、增量解析、闭包校验</text><text x="64" y="42" font-size="16" fill="var(--muted, #5e5d57)">v0.9.4 架构分层</text><text x="560" y="42" font-size="16" fill="var(--muted, #5e5d57)">v1.6.0 普通 CLI 分层</text><text x="64" y="518" font-size="16" fill="var(--muted, #5e5d57)">Code Mode 挂在工具编排层；Durable、env、chord 属于独立运行链。</text></svg>