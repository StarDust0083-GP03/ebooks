<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 334" width="480" height="334" role="img" aria-label="分层系统提示词与 Continual Harness 精炼流程">
<title>分层系统提示词与 Continual Harness 精炼流程</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">前缀缓存不变与持续精炼并存：静态层、动态尾与独立摘要消息</text><rect x="8" y="24" width="218" height="112" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="17" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">系统提示词 · 静态前缀 (可缓存)</text><text x="17" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">1. core.md: 单工具 python_repl 与 API</text><text x="17" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">2. usage.md: 强制执行规约</text><text x="17" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">3. opinionated.md: 风格与协作原则</text><text x="17" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">4. model-prompts: 按模型匹配追加</text><text x="17" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   (如 glm-5.3* -&gt; bash 规则)</text><rect x="152" y="28" width="66" height="16" rx="8" fill="none" stroke="var(--forest)" stroke-width="0.9"/><text x="185.0" y="39.2" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="var(--forest)" text-anchor="middle" opacity="1">字节级稳定</text><rect x="244" y="24" width="228" height="112" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="253" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">系统提示词 · 动态尾部 (按会话)</text><text x="253" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• packages: 预装包与 uv pip 提示</text><text x="253" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• project-context: 发现的 AGENTS.md</text><text x="253" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• skills-inventory: 可见技能清单</text><text x="253" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• mcp-servers / environment</text><text x="253" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• session-role (深度与父子角色)</text><line x1="226" y1="80" x2="244" y2="80" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="8" y="154" width="464" height="58" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="17" y="171" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">[harness-digest] 独立用户消息（不污染静态系统前缀）</text><text x="17" y="186" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">合并全局与会话本地 harness_state.json，按当前目标与近 4 条对话词项打分排序</text><text x="17" y="199" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">携带 stateFingerprint 指纹；状态未变时不重复追加，冷启动/恢复/压缩边界按需投递</text><rect x="8" y="232" width="144" height="72" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="17" y="249" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">触发精炼</text><text x="17" y="264" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">/refine 命令或</text><text x="17" y="277" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">await refine.run()</text><text x="17" y="290" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">或压缩后自动触发</text><text x="17" y="303" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">当前回合结束后执行</text><rect x="168" y="232" width="144" height="72" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="177" y="249" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">小步证据更新</text><text x="177" y="264" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">五类持久条目:</text><text x="177" y="277" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">prompt / memory /</text><text x="177" y="290" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">skill / subagent /</text><text x="177" y="303" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">factory (含版本号)</text><rect x="328" y="232" width="144" height="72" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="337" y="249" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">审计与回滚保障</text><text x="337" y="264" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">永不改写静态基础提示</text><text x="337" y="277" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">refinement_history.jsonl</text><text x="337" y="290" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">记录触发源、变更与证据</text><text x="337" y="303" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">支持按快照回退</text><line x1="152" y1="268" x2="168" y2="268" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="312" y1="268" x2="328" y2="268" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><polyline points="400,232 400,212" fill="none" stroke="var(--amber)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="8" y="322" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">prime-agent prompt 命令可打印完整分段拆解与 cached_prefix_len 字节边界。</text>
</svg>