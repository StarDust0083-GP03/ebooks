<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 256" width="660" height="256" role="img" aria-label="MCP Events 三种投递模式与 MCP Tasks 异步编排回路">
<title>MCP Events 三种投递模式与 MCP Tasks 异步编排回路</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
  </marker>
</defs>
<text x="12" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">MCP Events 三种投递模式与 MCP Tasks 长程异步编排</text><rect x="12" y="34" width="196" height="54" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="22" y="54" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">Webhook (events/subscribe)</text><text x="22" y="72" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">HTTPS + whsec_ HMAC 签名</text><text x="22" y="88" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">适合远程常驻与离线唤醒</text><rect x="12" y="98" width="196" height="54" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="22" y="118" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">Push (events/stream)</text><text x="22" y="136" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">长连接流 + heartbeatMs 心跳</text><text x="22" y="152" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">适合 stdio 与在线实时日志</text><rect x="12" y="162" width="196" height="54" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="22" y="182" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">Poll (events/poll)</text><text x="22" y="200" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">客户端按 nextPollMs 拉取</text><text x="22" y="216" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">适合 NAT 后 CLI / 无状态服</text><line x1="208" y1="61" x2="242" y2="114" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="208" y1="125" x2="242" y2="125" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="208" y1="189" x2="242" y2="136" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="244" y="68" width="188" height="114" rx="4" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="254" y="88" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--amber)" text-anchor="start">Client SDK 事件消费层</text><text x="254" y="106" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">持久化 cursor 断点续传</text><text x="254" y="122" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">truncated: true 感知缺口</text><text x="254" y="138" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">按 (订阅, eventId) 去重</text><text x="254" y="154" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">同轨迹续跑 / 隔离新轨迹</text><text x="254" y="170" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">载荷视同不可信输入</text><line x1="432" y1="125" x2="460" y2="125" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="462" y="34" width="186" height="182" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="472" y="54" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">Agent + MCP Tasks</text><text x="472" y="72" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">唤醒 Agent 发起排查</text><text x="472" y="88" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">长任务返回 resultType:task</text><text x="472" y="104" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">128 位高熵 taskId 轮询</text><text x="472" y="120" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">遇阻转 input_required</text><text x="472" y="136" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">经 tasks/update 补输入</text><text x="472" y="152" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">终态 immutable 回写结果</text><text x="472" y="168" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">tasks/cancel 协作取消</text><text x="12" y="240" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="var(--muted)" text-anchor="start">职责边界: 监听外部未知时刻发生的事用 Events; 追踪自己发起的长耗时作业用 Tasks。</text>
</svg>