<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 468" role="img" aria-labelledby="durable-replay-title durable-replay-desc" style="font-family:'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"><title id="durable-replay-title">确定性重放机制，脱离内存快照</title><desc id="durable-replay-desc">首次运行先将工具结果写入 journal 再交付脚本；重启后在相同代码与确定性条件下按序重放结果，再继续执行。</desc><defs><marker id="durable-replay-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--brand, #1B365D)"/></marker></defs><rect width="960" height="468" rx="6" fill="var(--paper, #faf9f5)"/><path d="M294 111 H348" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#durable-replay-arrow)"/><path d="M612 111 H666" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#durable-replay-arrow)"/><path d="M294 337 H348" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#durable-replay-arrow)"/><path d="M612 337 H666" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#durable-replay-arrow)"/><path d="M798 154 V256 Q798 264 790 264 H488 Q480 264 480 272 V294" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#durable-replay-arrow)"/><rect x="30" y="68" width="264" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="162.0" y="102" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">相同代码与环境</text><text x="162.0" y="139" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">seed、虚拟时间、VM 指纹</text><rect x="348" y="68" width="264" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="480.0" y="102" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">首次运行</text><text x="480.0" y="139" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">发出嵌套工具任务</text><rect x="666" y="68" width="264" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="798.0" y="102" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">先记账再交付</text><text x="798.0" y="139" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">结果顺序写入 journal</text><rect x="30" y="294" width="264" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="162.0" y="328" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">进程重启</text><text x="162.0" y="365" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">恢复 Harness 与任务</text><rect x="348" y="294" width="264" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="480.0" y="328" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">重新运行脚本</text><text x="480.0" y="365" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">按序喂回已记录结果</text><rect x="666" y="294" width="264" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="798.0" y="328" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">关联任务并继续</text><text x="798.0" y="365" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">未完成调用服从 replay 策略</text><text x="30" y="434" font-size="16" fill="var(--muted, #5e5d57)">外部副作用仍需服务端幂等；普通 CLI 的单次脚本执行不含这套持久重放保证。</text></svg>