<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 256" width="660" height="256" role="img" aria-label="Skills over MCP 渐进披露与 SHA-256 摘要更新流程">
<title>Skills over MCP 渐进披露与 SHA-256 摘要更新流程</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
  </marker>
</defs>
<text x="12" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">io.modelcontextprotocol/skills 渐进披露与 SHA-256 完整性校验</text><rect x="12" y="32" width="192" height="78" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="22" y="52" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">阶段 1: 连接期轻量发现</text><text x="22" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">调用 skills/list (带 ttlMs)</text><text x="22" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">仅将 name + description</text><text x="22" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">注入系统指令，零全文膨胀</text><line x1="204" y1="71" x2="232" y2="71" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="234" y="32" width="192" height="78" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="244" y="52" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">阶段 2: 锚定清单与审批</text><text x="244" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">按账号返回定制 Playbook</text><text x="244" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">列出文件 URI/size/sha256</text><text x="244" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">用户审批严格绑定整份清单</text><line x1="426" y1="71" x2="454" y2="71" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="456" y="32" width="192" height="78" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="466" y="52" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">阶段 3: 按需读取验签</text><text x="466" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">调用 resources/read</text><text x="466" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">校验字节数 + SHA-256</text><text x="466" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">核对 frontmatter 一致</text><line x1="552" y1="110" x2="552" y2="138" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="336" y="140" width="312" height="78" rx="4" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="346" y="160" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--amber)" text-anchor="start">阶段 4: 远端变更与热更新</text><text x="346" y="178" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">服务端更新 SKILL.md -&gt; 摘要变化</text><text x="346" y="194" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">本地缓存未命中或校验报错，立即拒绝旧内容</text><text x="346" y="210" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">刷新 skills/get，撤销旧审批并重新确认</text><line x1="336" y1="179" x2="306" y2="179" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="140" width="292" height="78" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="22" y="160" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">本地缓存与来源隔离</text><text x="22" y="178" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">按 (serverId, uri, sha256) 落盘缓存</text><text x="22" y="194" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">排除出本地文件系统技能自动发现路径</text><text x="22" y="210" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">跨 Server 读取须双方显式逐次授权</text><text x="12" y="240" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="var(--muted)" text-anchor="start">未列举技能可通过 skills/get(uri) 直接按需加载; 单个 Skill 建议不超过 512 文件或 16 MiB。</text>
</svg>