<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 256" width="420" height="256" role="img" aria-label="工具审批、文件事实、配置启用与执行隔离边界">
<title>工具审批、文件事实、配置启用与执行隔离边界</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">ADR 003 / 009 / 010 / 012 / 018：三条职责边界互不越权</text><rect x="8" y="24" width="260" height="128" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="16" y="39.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">路径 A：模型决策触发的工具调用</text><text x="16" y="53.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">1. Permission 评估三预设（ADR 018）：</text><text x="16" y="65.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   read-only / workspace-write / full-access</text><text x="16" y="78.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">2. 叠加固定文件事实（FileAccessFacts）</text><text x="16" y="90.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   + SessionGrants（仅在 Ask 放行，不压 Deny）</text><text x="16" y="103.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   + CommandRules（deny 永远胜出）+ Hooks 建议</text><text x="16" y="115.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">3. 需询问 → Approval 写 approval/request</text><text x="16" y="128.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   首条有效 approval/respond 胜出；中断写 cancelled</text><rect x="278" y="24" width="134" height="128" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="286" y="39.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.1" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">执行隔离（可选）</text><text x="286" y="53.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">HostPlatform 只执行</text><text x="286" y="65.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">不再二次否决准入</text><text x="286" y="78.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">（ADR 009）</text><text x="286" y="90.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">沙箱默认关闭</text><text x="286" y="103.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">（ADR 010 opt-in）</text><text x="286" y="115.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">macOS seatbelt</text><text x="286" y="128.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">Linux bwrap</text><line x1="268" y1="86" x2="278" y2="86" stroke="var(--forest)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="8" y="166" width="404" height="62" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="16" y="181.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">路径 B：配置驱动的外部执行（ADR 003：不走工具审批）</text><text x="16" y="195.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">覆盖对象：MCP 服务器进程、Hook 命令、Workflow 定义、插件包</text><text x="16" y="207.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">规则：项目目录（.mcp.json / .dimcode）来源默认禁用，只有用户本地配置可启用</text><text x="16" y="220.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">安全策略不写入 Timeline；回放、恢复与分叉绝不恢复或放大既有权限</text><text x="8" y="244" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.1" font-weight="400" fill="var(--amber)" text-anchor="start" opacity="1">exec 不接受模型传入 sandbox/network 参数；模型只能接受环境，不能自选沙箱。</text>
</svg>