<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 262" width="420" height="262" role="img" aria-label="rutis 跨语言运行时与数据面边界">
<title>rutis 跨语言运行时与数据面边界</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">rutis 0.23.0（协议 5）：每个插件占 1 行进程配置，服务面统一为数据面</text><rect x="8" y="24" width="178" height="124" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="16" y="39.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Rust 宿主内核</text><text x="16" y="53.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">1. 进程根与共享目录（111 服务）</text><text x="16" y="65.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">2. 75 个跨语言 data 数据面</text><text x="16" y="78.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">3. 36 个 internal(reason) 私有面</text><text x="16" y="90.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">4. Session / Branch = 普通插件</text><text x="16" y="103.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   （ADR 015 mark_scope）</text><text x="16" y="115.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">5. xtask types 生成 .d.ts 契约</text><rect x="226" y="24" width="186" height="56" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="234" y="39.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.1" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Node / TypeScript 运行时</text><text x="234" y="53.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">@arcships/rutis 0.23 · Cordis 4</text><text x="234" y="65.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">workflow / light-ocr / 自写插件</text><text x="234" y="78.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">通过 partRegistry 登记定义</text><rect x="226" y="92" width="186" height="56" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="234" y="107.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.1" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Python 运行时（py:&lt;module&gt;）</text><text x="234" y="121.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">独立进程会话 · isolate 表解析</text><text x="234" y="133.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">相同 inject / use / provide</text><text x="234" y="146.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">与 Rust/TS 互调同一数据面</text><line x1="186" y1="48" x2="226" y2="48" stroke="var(--amber)" stroke-width="1.05" marker-end="url(#arrow)"/><line x1="226" y1="62" x2="186" y2="62" stroke="var(--amber)" stroke-width="1.05" marker-end="url(#arrow)"/><line x1="186" y1="114" x2="226" y2="114" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><line x1="226" y1="128" x2="186" y2="128" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="8" y="162" width="404" height="72" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="16" y="177.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">数据面契约（HostDispatch at host_key(name) + 共享目录项）</text><text x="16" y="191.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">参数、返回值、错误均为 serde 数据（{code, message}）；句柄与 &amp;mut 不跨语言</text><text x="16" y="203.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">对象拆成 id + 操作（execHost / fsHost / store / timelineStore / toolRegistry）</text><text x="16" y="216.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">单帧 16 MiB 上限，超长走 0.23 chunk 分片（单片 8 MiB，默认上限 256 MiB）</text><text x="16" y="228.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">禁止手写第二层适配逻辑：Rust 本地绑定与跨语言线协议共用同一所有者实现</text><text x="8" y="250" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.1" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">注意：before 回调在提交锁内同步运行，禁止跨进程调用，只限进程内 Rust 注册。</text>
</svg>