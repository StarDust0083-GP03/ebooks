<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 334" width="420" height="334" role="img" aria-label="一次对话回合的六步处理链路">
<title>一次对话回合的六步处理链路</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="11" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="start">一轮 WebSocket 对话在单进程宿主内的控制流与保护点</text><circle cx="19" cy="41" r="11" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1"/><text x="19" y="44.3" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="700" fill="var(--forest)" text-anchor="middle">1</text><rect x="38" y="22" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="47" y="38" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">WS 接入与先订阅</text><text x="47" y="52.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">JWT 鉴权 → resolve_thread_id → 先 hub.subscribe 再 await steer</text><line x1="19" y1="52" x2="19" y2="70" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="19" cy="89" r="11" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1"/><text x="19" y="92.3" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="700" fill="var(--forest)" text-anchor="middle">2</text><rect x="38" y="70" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="47" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">统一入队</text><text x="47" y="100.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">prepare_dashboard_turn → InboundMessage → ChannelManager.enqueue</text><line x1="19" y1="100" x2="19" y2="118" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="19" cy="137" r="11" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1"/><text x="19" y="140.3" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="700" fill="var(--forest)" text-anchor="middle">3</text><rect x="38" y="118" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="47" y="134" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">路由与前置拦截</text><text x="47" y="148.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">GlobalProcessor：slash / HITL 恢复 / 过期模型回退 Auto / 知识检索</text><line x1="19" y1="148" x2="19" y2="166" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="19" cy="185" r="11" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1"/><text x="19" y="188.3" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="700" fill="var(--amber)" text-anchor="middle">4</text><rect x="38" y="166" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="47" y="182" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">运行图与中间件</text><text x="47" y="196.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">AgentManager.stream → ConsecutiveToolCall(40) · Failover · UI Offload</text><line x1="19" y1="196" x2="19" y2="214" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="19" cy="233" r="11" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1"/><text x="19" y="236.3" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="700" fill="var(--forest)" text-anchor="middle">5</text><rect x="38" y="214" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="47" y="230" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">记录与流式推送</text><text x="47" y="244.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">usage_tracker → history_tracker → 轨迹/产物去重 → WS / IM 投递</text><line x1="19" y1="244" x2="19" y2="262" stroke="var(--line)" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="19" cy="281" r="11" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1"/><text x="19" y="284.3" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="700" fill="var(--amber)" text-anchor="middle">6</text><rect x="38" y="262" width="374" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="47" y="278" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">断线与取消分离</text><text x="47" y="292.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">WS 断开仅注销订阅，turn 继续运行；显式 cancel 才发取消信号</text><text x="8" y="322" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.3" font-weight="400" fill="var(--amber)" text-anchor="start">注意：连续相同工具调用超过上限会立即 jump_to=end，正常换工具或改参数会重置计数。</text>
</svg>