<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 324" width="480" height="324" role="img" aria-label="Protocol v3 Python REPL 双通道与状态循环">
<title>Protocol v3 Python REPL 双通道与状态循环</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">Protocol v3 换行分隔 JSON 协议与双通道隔离</text><rect x="8" y="24" width="186" height="178" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="17" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Rust 宿主 KernelManager</text><text x="17" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">1. 发送 execute / interrupt</text><text x="17" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   / snapshot / restore</text><text x="17" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">2. 接收 stdout / stderr /</text><text x="17" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   result / display / done</text><text x="17" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">3. HeadTailBuffer 截断:</text><text x="17" y="121" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   65,536 chars = 3/4 头</text><text x="17" y="134" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   + 1/4 滚动尾</text><text x="17" y="147" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">4. 默认 60s 超时 (上限180s)</text><text x="17" y="160" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">   超时不响应则强制重启内核</text><rect x="274" y="24" width="198" height="178" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="283" y="41" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">CPython 进程 (rlm.repl)</text><text x="283" y="56" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• fd 0 读线程接收请求,</text><text x="283" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">  用户代码 stdin 重绑 /dev/null</text><text x="283" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 私有 dup(fd 1) 加锁写协议帧</text><text x="283" y="95" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• _TaggedWriter 拦截 sys.stdout</text><text x="283" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">  ContextVar 归属 cell id</text><text x="283" y="121" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 原始 fd 1/2 重定向至 _Pump 管</text><text x="283" y="134" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">  输出 id: null (不误归属 cell)</text><text x="283" y="147" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">• 结束前写 \xff&lt;drain:uuid&gt;\xff</text><text x="283" y="160" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">  围栏刷新管道, 再发 done</text><line x1="194" y1="58" x2="274" y2="58" stroke="var(--amber)" stroke-width="1.1" marker-end="url(#arrow)"/><text x="234" y="52" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--amber)" text-anchor="middle" opacity="1">stdin 请求帧</text><line x1="274" y1="96" x2="194" y2="96" stroke="var(--forest)" stroke-width="1.1" marker-end="url(#arrow)"/><text x="234" y="90" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--forest)" text-anchor="middle" opacity="1">dup(fd1) 事件帧</text><line x1="274" y1="140" x2="194" y2="140" stroke="var(--muted)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="234" y="134" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="middle" opacity="1">host_request</text><line x1="194" y1="174" x2="274" y2="174" stroke="var(--muted)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="234" y="168" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="middle" opacity="1">host_reply(带外)</text><rect x="8" y="222" width="224" height="72" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="17" y="239" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">带外控制通道（不排执行队列）</text><text x="17" y="254" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">interrupt: Unix SIGINT / await 取消</text><text x="17" y="267" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">host_reply: 唤醒 await host_request()</text><text x="17" y="280" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">bash_activity / mcp_status: 运行中可查</text><rect x="248" y="222" width="224" height="72" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="257" y="239" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">dill v2 状态快照与恢复</text><text x="257" y="254" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">单变量上限 16 MiB, 总量上限 256 MiB</text><text x="257" y="267" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">os.replace 原子落盘 + manifest.json</text><text x="257" y="280" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">文件句柄恢复为已关闭 stub (不重开截断)</text><line x1="120" y1="202" x2="120" y2="222" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="360" y1="202" x2="360" y2="222" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><text x="8" y="312" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">单次 display / host_request 严格校验 allow_nan=False 且载荷不超过 16 MiB。</text>
</svg>