<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 492" role="img" aria-labelledby="discovery-title discovery-desc" style="font-family:'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"><title id="discovery-title">工具发现的三条路径</title><desc id="discovery-desc">已注册工具可直接声明给模型、经脚本发现调用，或通过 tool_search 按需声明；hidden 工具不可达。</desc><defs><marker id="discovery-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--brand, #1B365D)"/></marker></defs><rect width="960" height="492" rx="6" fill="var(--paper, #faf9f5)"/><path d="M420 114 V138 Q420 146 412 146 H164 Q156 146 156 154 V188" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#discovery-arrow)"/><path d="M480 114 V188" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#discovery-arrow)"/><path d="M540 114 V138 Q540 146 548 146 H796 Q804 146 804 154 V188" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#discovery-arrow)"/><path d="M156 274 V344" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#discovery-arrow)"/><path d="M480 274 V344" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#discovery-arrow)"/><path d="M804 274 V344" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#discovery-arrow)"/><rect x="340" y="28" width="280" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="480.0" y="62" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">工具注册与 exposure</text><text x="480.0" y="99" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">按策略控制可见性与调用面</text><rect x="36" y="188" width="240" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="156.0" y="222" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">direct</text><text x="156.0" y="259" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">默认向模型声明</text><rect x="348" y="188" width="264" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="480.0" y="222" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">codemode</text><text x="480.0" y="259" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">脚本发现后调用</text><rect x="684" y="188" width="240" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="804.0" y="222" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">deferred</text><text x="804.0" y="259" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">按需加载声明</text><rect x="36" y="344" width="240" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="156.0" y="378" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">普通工具调用</text><text x="156.0" y="415" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">直接进入模型工具表</text><rect x="348" y="344" width="264" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="480.0" y="378" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">searchTools / describe</text><text x="480.0" y="415" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">结果先返回脚本</text><rect x="684" y="344" width="240" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="804.0" y="378" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">tool_search</text><text x="804.0" y="415" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">加载后直接调用</text><text x="40" y="468" font-size="16" fill="var(--muted, #5e5d57)">MCP 的 codemode 与 deferred 均可被脚