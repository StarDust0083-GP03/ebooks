<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" role="img" aria-labelledby="deployment-title deployment-desc" style="font-family:'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"><title id="deployment-title">同一脚本 API，三种计算部署位置</title><desc id="deployment-desc">Node/Bun 使用 worker thread，Cloudflare 可把 VM 放到独立 Worker 的 Durable Object，inline 模式在调用线程运行。</desc><defs><marker id="deployment-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--brand, #1B365D)"/></marker></defs><rect width="960" height="506" rx="6" fill="var(--paper, #faf9f5)"/><path d="M340 103 H620" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M340 261 H620" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M340 419 H620" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#deployment-arrow)"/><rect x="40" y="60" width="300" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="190.0" y="94" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">Node / Bun 宿主</text><text x="190.0" y="131" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">工具管线与 deadline</text><rect x="620" y="60" width="300" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="770.0" y="94" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">worker thread</text><text x="770.0" y="131" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">QuickJS VM（默认 256 MiB）</text><rect x="40" y="218" width="300" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="190.0" y="252" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">Cloudflare 会话侧</text><text x="190.0" y="289" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">工具与调用记录</text><rect x="620" y="218" width="300" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="770.0" y="252" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">独立部署的 Worker</text><text x="770.0" y="289" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">Durable Object 内 VM（32 MiB）</text><rect x="40" y="376" width="300" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="190.0" y="410" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">Inline 宿主</text><text x="190.0" y="447" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">接受同步计算阻塞调用线程</text><rect x="620" y="376" width="300" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="770.0" y="410" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">同一线程的 VM</text><text x="770.0" y="447" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">interrupt budget 约束</text><text x="415" y="84" font-size="16" fill="var(--muted, #5e5d57)">线程消息</text><text x="410" y="242" font-size="16" fill="var(--muted, #5e5d57)">Workers RPC</text><text x="420" y="400" font-size="16" fill="var(--muted, #5e5d57)">直接调用</text></svg>