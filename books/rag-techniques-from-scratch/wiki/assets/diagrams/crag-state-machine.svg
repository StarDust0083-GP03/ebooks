<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 206" width="540" height="206" role="img" aria-label="CRAG 与受控纠错检索状态机">
<title>CRAG 与受控纠错检索状态机</title>
<defs><marker id="arr-crag-state-machine" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--muted)"/></marker></defs>
<text x="10" y="14" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">纠错检索状态机（内部规范默认禁止无依据自由发挥）</text><rect x="10" y="28" width="122" height="62" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="20" y="45" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">1. 检索与质检</text><text x="20" y="61" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">authorized_scope</text><text x="20" y="75" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">相关性 + 充分性</text><line x1="132" y1="59" x2="156" y2="40" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-crag-state-machine)"/><line x1="132" y1="59" x2="156" y2="96" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-crag-state-machine)"/><line x1="132" y1="59" x2="156" y2="152" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-crag-state-machine)"/><rect x="156" y="16" width="154" height="46" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="166" y="33" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">correct（证据充分）</text><text x="166" y="49" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">进入打包与引用校验</text><rect x="156" y="72" width="154" height="46" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="166" y="89" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">ambiguous（证据偏弱）</text><text x="166" y="105" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">受控改写重试（限次数）</text><rect x="156" y="128" width="154" height="46" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="166" y="145" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">incorrect（未命中）</text><text x="166" y="161" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">不凭参数知识硬猜</text><line x1="310" y1="39" x2="344" y2="39" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-crag-state-machine)"/><rect x="344" y="16" width="186" height="46" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="354" y="33" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">返回 evidence_ready</text><text x="354" y="49" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">逐句绑定 injected_ids</text><line x1="310" y1="95" x2="344" y2="95" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-crag-state-machine)"/><rect x="344" y="72" width="186" height="46" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="354" y="89" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">attempt &lt; max_attempts</text><text x="354" y="105" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">重新检索；权限范围不变</text><line x1="437" y1="118" x2="437" y2="128" stroke="var(--muted)" stroke-width="1.15" stroke-dasharray="4 3" marker-end="url(#arr-crag-state-machine)"/><line x1="310" y1="151" x2="344" y2="151" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-crag-state-machine)"/><rect x="344" y="128" width="186" height="46" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="354" y="145" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">insufficient_evidence</text><text x="354" y="161" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">明确拒答，不默认上网泄密</text><text x="10" y="194" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--amber)" text-anchor="start">与开放问答不同：内部规则助手遇到无证据时，少答优于用模型常识或公网结果硬凑。</text>
</svg>