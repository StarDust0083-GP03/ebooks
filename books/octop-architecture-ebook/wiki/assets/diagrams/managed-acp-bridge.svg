<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 264" width="420" height="264" role="img" aria-label="托管专家 ACP 回环与 Bridge 跨实例桥接对比">
<title>托管专家 ACP 回环与 Bridge 跨实例桥接对比</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="11" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.1" font-weight="600" fill="var(--muted)" text-anchor="start">两种跨边界能力：托管专家在本机拉外部进程，Bridge 把请求转发给对端实例</text><rect x="8" y="22" width="404" height="114" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="17" y="38" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.8" font-weight="600" fill="var(--ink)" text-anchor="start">托管专家（kind = managed · v1.0.3b6 / b7）</text><rect x="18" y="44" width="116" height="46" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="27" y="60" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="var(--ink)" text-anchor="start">Octop 宿主</text><text x="27" y="74.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">session_modes.py</text><text x="27" y="86.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">ask / yolo 权限门</text><rect x="156" y="44" width="116" height="46" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="165" y="60" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="var(--ink)" text-anchor="start">外部 ACP Runner</text><text x="165" y="74.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">OpenCode / Claude</text><text x="165" y="86.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">Codex / CodeBuddy</text><rect x="294" y="44" width="108" height="46" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="303" y="60" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--ink)" text-anchor="start">6 个回环 MCP</text><text x="303" y="74.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">knowledge · agents</text><text x="303" y="86.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">files · cron · plugins</text><line x1="134" y1="67" x2="156" y2="67" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="272" y1="67" x2="294" y2="67" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><text x="18" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start">通过 session/set_mode 下发模式；通过本地 HTTP 回环把 Octop 工具暴露给外部子进程。</text><text x="18" y="123" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start">技能包按 runner 目录（.claude/.opencode/.codex/skills）建软链或 Junction。</text><rect x="8" y="150" width="404" height="104" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="17" y="166" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.8" font-weight="600" fill="var(--ink)" text-anchor="start">云端协同 Bridge（bridge:{conn_id}:{remote_agent_id}）</text><rect x="18" y="172" width="116" height="44" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="27" y="188" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="var(--ink)" text-anchor="start">本机 Octop</text><text x="27" y="202.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">识别远端引用</text><text x="27" y="214.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">不复制专家与历史</text><rect x="156" y="172" width="116" height="44" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="165" y="188" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="var(--ink)" text-anchor="start">机机 WS 隧道</text><text x="165" y="202.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">tunnel_policy.py</text><text x="165" y="214.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">默认拒绝未知路径</text><rect x="294" y="172" width="108" height="44" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="303" y="188" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="var(--ink)" text-anchor="start">远端 Octop</text><text x="303" y="202.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">远端登录态鉴权</text><text x="303" y="214.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">持有工作区与权威</text><line x1="134" y1="194" x2="156" y2="194" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="272" y1="194" x2="294" y2="194" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><text x="18" y="234" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start">两边 user_id 不等价；远端资源可见性严格由对端连接账号决定，断桥绝不切本地同名专家。</text>
</svg>