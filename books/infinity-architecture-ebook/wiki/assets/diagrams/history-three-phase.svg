<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img" aria-label="HistoryManager 三阶段未落盘状态与溢出恢复">
<title>HistoryManager 三阶段未落盘状态与溢出恢复</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--amber)"/></marker><marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--forest)"/></marker></defs>
<text x="10" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">HistoryManager 三阶段未落盘状态、轮次缓冲与溢出恢复</text><rect x="10" y="34" width="184" height="82" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="20" y="53" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="10" font-weight="600" fill="var(--amber)" text-anchor="start">1. unvalidated_items</text><text x="20" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">刚入内存的新输入</text><text x="20" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">用户文本 / 工具结果 / 合成事件</text><text x="20" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">sync() 跳过，防毒消息落盘</text><line x1="194" y1="75" x2="226" y2="75" stroke="var(--forest)" stroke-width="1.2" marker-end="url(#arrow-forest)"/><text x="210" y="66" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--forest)" text-anchor="middle">首输出</text><rect x="228" y="34" width="184" height="82" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="238" y="53" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="10" font-weight="600" fill="var(--forest)" text-anchor="start">2. pending_items</text><text x="238" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">mark_inputs_model_validated</text><text x="238" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">已证安全输入 + 已刷轮次</text><text x="238" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">断言: 无未验证项才可提交</text><line x1="412" y1="75" x2="444" y2="75" stroke="var(--forest)" stroke-width="1.2" marker-end="url(#arrow-forest)"/><text x="428" y="66" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="8.8" font-weight="600" fill="var(--forest)" text-anchor="middle">sync()</text><rect x="446" y="34" width="184" height="82" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="456" y="53" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start">3. 持久化存储</text><text x="456" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">ConversationStore 追加消息</text><text x="456" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">StateStore 写非幂等去重 ID</text><text x="456" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">落盘屏障后才派发异步工具</text><rect x="228" y="152" width="184" height="72" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="238" y="171" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="9.8" font-weight="600" fill="var(--ink)" text-anchor="start">turn_buffer (流式缓冲)</text><text x="238" y="188" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">合并连续 Text 块</text><text x="238" y="204" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">正常结束: flush_turn()</text><text x="238" y="220" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">中途故障: discard_turn()</text><line x1="320" y1="152" x2="320" y2="116" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><text x="328" y="138" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start">flush_turn</text><line x1="102" y1="116" x2="102" y2="152" stroke="var(--amber)" stroke-width="1.2" marker-end="url(#arrow-amber)"/><text x="110" y="138" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="8.8" font-weight="600" fill="var(--amber)" text-anchor="start">ContextOverflow</text><rect x="10" y="152" width="184" height="72" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="20" y="171" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="9.6" font-weight="600" fill="var(--amber)" text-anchor="start">recover_from_overflow</text><text x="20" y="188" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">仅 1 条可替换项: 改占位符重试</text><text x="20" y="204" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">含用户输入或多条: 结算中断</text><text x="20" y="220" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">丢弃未验证用户输入并停止</text><line x1="538" y1="116" x2="538" y2="152" stroke="var(--forest)" stroke-width="1.2" marker-end="url(#arrow-forest)"/><text x="546" y="138" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--forest)" text-anchor="start">屏障之后</text><rect x="446" y="152" width="184" height="72" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="456" y="171" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="9.8" font-weight="600" fill="var(--forest)" text-anchor="start">execute_action()</text><text x="456" y="188" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">POST /invoke 异步派发</text><text x="456" y="204" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">失败则回注错误结果</text><text x="456" y="220" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">避免线程永久挂起等待</text><text x="10" y="248" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="400" fill="var(--muted)" text-anchor="start">顺序不变量: pending_items 始终位于 unvalidated_items 之前；普通工具结果靠尾扫 match_tool_result 去重。</text>
</svg>
