<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 282" width="660" height="282" role="img" aria-label="2025 有状态粘性会话与 2026-07-28 无状态头路由对比">
<title>2025 有状态粘性会话与 2026-07-28 无状态头路由对比</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
  </marker>
</defs>
<text x="12" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="var(--amber)" text-anchor="start">旧架构 (2025): 有状态粘性会话与连接绑定</text><rect x="12" y="28" width="192" height="74" rx="4" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="22" y="48" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--amber)" text-anchor="start">Client / Subagents</text><text x="22" y="66" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">新开连接须重跑 initialize</text><text x="22" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">重拉 O(N x M) tools/list</text><line x1="204" y1="65" x2="232" y2="65" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="234" y="28" width="192" height="74" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="244" y="48" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">粘性负载均衡器</text><text x="244" y="66" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">依赖 Mcp-Session-Id 路由</text><text x="244" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">GET SSE 常驻连接易超时</text><line x1="426" y1="65" x2="454" y2="65" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="456" y="28" width="192" height="74" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="466" y="48" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">单节点内存会话</text><text x="466" y="66" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">实例重启即丢会话状态</text><text x="466" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">列表结果跨会话不可缓存</text><line x1="12" y1="120" x2="648" y2="120" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="4 4"/><text x="12" y="142" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="var(--forest)" text-anchor="start">新内核 (2026-07-28): 无状态头镜像与可缓存列表</text><rect x="12" y="152" width="192" height="92" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="22" y="172" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">Client + ListCache</text><text x="22" y="190" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">每请求携带 _meta 能力</text><text x="22" y="206" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">按 ttlMs/cacheScope 复用</text><text x="22" y="222" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">显式传递 basket_id 句柄</text><line x1="204" y1="198" x2="232" y2="198" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="234" y="152" width="192" height="92" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="244" y="172" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">标准 L7 网关 / CDN</text><text x="244" y="190" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">读 Mcp-Method / Mcp-Name</text><text x="244" y="206" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">按 Mcp-Param-* 路由限流</text><text x="244" y="222" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">无粘性会话，任意轮询</text><line x1="426" y1="198" x2="454" y2="198" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="456" y="152" width="192" height="92" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="466" y="172" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">无状态副本 / Serverless</text><text x="466" y="190" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">校对头与 Body (-32020)</text><text x="466" y="206" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">按 Token 校验句柄权限</text><text x="466" y="222" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">subscriptions/listen 按需推</text><text x="12" y="266" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="var(--muted)" text-anchor="start">核心变化: 去掉 Mcp-Session-Id 与 initialize，把状态显式化为业务句柄与可缓存元数据。</text>
</svg>