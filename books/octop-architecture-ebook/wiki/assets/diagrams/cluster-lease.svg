<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="420" height="270" role="img" aria-label="多副本集群的 Cookie 粘滞与数据库同行租约">
<title>多副本集群的 Cookie 粘滞与数据库同行租约</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="11" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.1" font-weight="600" fill="var(--muted)" text-anchor="start">v1.0.3b6 Helm 多副本：Cookie 粘滞管实时流，数据库同行租约管后台单活</text><rect x="130" y="22" width="160" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="139" y="38" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">反向代理 / Ingress</text><text x="139" y="52.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">按 Cookie 粘滞（禁按来源 IP）</text><rect x="14" y="82" width="176" height="74" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="23" y="98" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">Octop 副本 A</text><text x="23" y="112.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">内存专家 + 实时 WS 推送</text><text x="23" y="124.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">持有通道/Cron 租约（90s）</text><text x="23" y="137.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">独立本机盘：/data/.octop</text><rect x="230" y="82" width="176" height="74" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.8"/><text x="239" y="98" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">Octop 副本 B</text><text x="239" y="112.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">内存专家 + 实时 WS 推送</text><text x="239" y="124.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">每 25s 巡检过期租约接管</text><text x="239" y="137.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">独立本机盘（严禁 NFS 共写）</text><line x1="182" y1="60" x2="102" y2="82" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="238" y1="60" x2="318" y2="82" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="14" y="182" width="392" height="58" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="23" y="198" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--ink)" text-anchor="start">共享 PostgreSQL 16 + pgvector</text><text x="23" y="212.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">控制面 · 技能包源 · 知识库原文与向量 · 专家记忆 · 腾讯云凭证</text><text x="23" y="224.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">租约常量（infra/db/lease.py）：TTL 90s · 续约 30s · 巡检接管 25s · 退出主动释放</text><line x1="102" y1="156" x2="156" y2="182" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><line x1="318" y1="156" x2="264" y2="182" stroke="var(--muted)" stroke-width="1.1" marker-end="url(#arrow)"/><text x="8" y="258" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start">工作区若留在容器临时盘会随 Pod 销毁；集群模式应配 PG / S3 / COS / TOS / OpenSandbox。</text>
</svg>