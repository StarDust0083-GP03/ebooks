<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" width="640" height="288" role="img" aria-label="本地单线程路由器与线程驱动状态机">
<title>本地单线程路由器与线程驱动状态机</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--amber)"/></marker><marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--forest)"/></marker></defs>
<text x="10" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">本地单线程 LocalSet 路由器、延迟队列与抢占状态机</text><rect x="10" y="34" width="286" height="100" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="20" y="53" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--forest)" text-anchor="start">route_loop (单线程 LocalSet)</text><text x="20" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">所有线程驱动直接托管于 FuturesUnordered</text><text x="20" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">准入检查: 非用户文本查 thread_exists 与</text><text x="20" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">is_thread_stopped (存储故障时 fail-open)</text><text x="20" y="118" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">异常经 log_panic 隔离，不拖垮其他线程</text><line x1="296" y1="84" x2="334" y2="84" stroke="var(--forest)" stroke-width="1.2" marker-end="url(#arrow-forest)"/><text x="315" y="74" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--forest)" text-anchor="middle">拉起</text><rect x="336" y="34" width="294" height="100" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="346" y="53" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--amber)" text-anchor="start">drive_thread (每活跃线程 1 个 Future)</text><text x="346" y="70" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">批量排空同线程通道，调用 filter_deferrable</text><text x="346" y="86" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">流式执行中若收到用户文本: cancel() 中断</text><text x="346" y="102" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">附加 &lt;interrupt&gt; 前缀并通知 RAP 取消工具</text><text x="346" y="118" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">Token &gt; 75% 上下文窗时触发自动压缩子线程</text><line x1="483" y1="134" x2="483" y2="162" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="10" y="164" width="296" height="88" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="20" y="183" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="start">DeferQueue 延迟策略 (本地 vs Lambda)</text><text x="20" y="200" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">尾部有未答非被动工具 (!is_passive()):</text><text x="20" y="216" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">  暂存订阅事件、子线程报告与父线程消息</text><text x="20" y="232" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">sleep 家族标记 is_passive() == true 可打断</text><text x="20" y="248" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">Lambda 默认 NoDeferral，直接按中断处理</text><rect x="326" y="164" width="304" height="88" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="336" y="183" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="var(--forest)" text-anchor="start">check_before_idle (同步原子退出)</text><text x="336" y="200" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">与路由共享 LocalSet，检查期间不让出调度</text><text x="336" y="216" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">有待答非 close_thread 工具 -&gt; AwaitInput</text><text x="336" y="232" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">仅剩活跃订阅或完全空闲 -&gt; Exit 释放内存</text><text x="336" y="248" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="var(--muted)" text-anchor="start">DriverGuard::drop 发出 Idle 生命周期事件</text><line x1="306" y1="208" x2="326" y2="208" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="10" y="274" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="400" fill="var(--muted)" text-anchor="start">客户端通过 SubscribeHandle 的 oneshot ACK 确认重放 ReplaySnapshot 安装完成，避免丢失并发事件。</text>
</svg>
