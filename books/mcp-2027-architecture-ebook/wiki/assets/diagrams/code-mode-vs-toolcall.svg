<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" role="img" aria-label="传统 Tool Calling 与 Code Mode 上下文和往返开销对比">
<title>传统 Tool Calling 与 Code Mode 上下文和往返开销对比</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
  </marker>
</defs>
<text x="12" y="18" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="var(--amber)" text-anchor="start">传统串行 Tool Calling (N+1 轮模型推理，中间数据全进上下文)</text><rect x="12" y="28" width="142" height="62" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="22" y="48" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">Turn 1: 模型</text><text x="22" y="66" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">调 linear.listIssues</text><text x="22" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">注入 50 个 Schema</text><line x1="154" y1="59" x2="174" y2="59" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="176" y="28" width="146" height="62" rx="4" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.5"/><text x="186" y="48" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--amber)" text-anchor="start">20 条 Issue 原文</text><text x="186" y="66" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">全部写回对话历史</text><text x="186" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">上下文迅速膨胀</text><line x1="322" y1="59" x2="342" y2="59" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="344" y="28" width="142" height="62" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="354" y="48" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">Turn 2..N: 循环</text><text x="354" y="66" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">逐条查 Sentry 统计</text><text x="354" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">每步多一轮推理</text><line x1="486" y1="59" x2="506" y2="59" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="508" y="28" width="140" height="62" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="518" y="48" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">最终汇总</text><text x="518" y="66" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">高延迟 + 高 Token</text><text x="518" y="82" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">中间载荷污染窗口</text><line x1="12" y1="108" x2="648" y2="108" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="4 4"/><text x="12" y="130" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="var(--forest)" text-anchor="start">Code Mode (1 轮生成脚本，沙箱内存过滤 Join，沙箱外持有 OAuth)</text><rect x="12" y="140" width="174" height="92" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="22" y="160" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">Turn 1: 类型化桩代码</text><text x="22" y="178" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">由 inputSchema 与</text><text x="22" y="194" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">outputSchema 自动生成</text><text x="22" y="210" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">模型一次写出异步脚本</text><line x1="186" y1="186" x2="212" y2="186" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="214" y="140" width="224" height="92" rx="4" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.5"/><text x="224" y="160" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--forest)" text-anchor="start">隔离执行沙箱 (无原始凭证)</text><text x="224" y="178" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">Promise.all 并发调多 Server</text><text x="224" y="194" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">structuredContent 内存 Join</text><text x="224" y="210" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">OAuth 2.1 在沙箱外由宿主管</text><line x1="438" y1="186" x2="464" y2="186" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="466" y="140" width="182" height="92" rx="4" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.9"/><text x="476" y="160" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="start">精简结果回传模型</text><text x="476" y="178" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">仅 P0 摘要进入上下文</text><text x="476" y="194" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">图像/音频独立块保留</text><text x="476" y="210" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10" font-weight="400" fill="var(--muted)" text-anchor="start">Token 降幅常超一个量级</text><text x="12" y="254" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="var(--muted)" text-anchor="start">关键前提: 服务端声明 outputSchema 并返回 structuredContent，模型才能在编码前获知返回结构。</text>
</svg>