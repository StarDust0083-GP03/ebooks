ber)" stroke-width="1.3"/><text x="16" y="133.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">能力插件层</text><text x="16" y="147.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">dim-agent-capabilities（20 个分支 Capability）</text><text x="308" y="141" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">Loop / 权限 / 树</text><line x1="155" y1="158" x2="155" y2="166" stroke="var(--line)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="8" y="166" width="294" height="40" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="16" y="181.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">运行内核与契约层</text><text x="16" y="195.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">dim-agent-runtime（rutis 0.23）→ dim-agent-types</text><text x="308" y="189" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">总线 / 13 保留域</text><line x1="8" y1="220" x2="412" y2="220" stroke="var(--line)" stroke-width="0.7" stroke-dasharray="3 3"/><text x="8" y="236" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">三层作用域树（ADR 002 / ADR 015）：按状态所有者放置部件</text><rect x="8" y="246" width="404" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="16" y="261.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Process 根作用域（58 个服务）</text><text x="16" y="275.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">SessionStore · Provider · Mcp · SkillsCatalog · Settings · PartRegistry</text><rect x="26" y="294" width="386" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="34" y="309.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Session 作用域（31 个服务，一个主体）</text><text x="34" y="323.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">TimelineTree · ToolRegistry · PromptRegistry · WorkspaceTools</text><rect x="44" y="342" width="368" height="38" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="52" y="357.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">Branch 作用域（22 个服务，一条行为线）</text><text x="52" y="371.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">Timeline · Dispatcher · Loop · InputQueue · Permission · Approval</text><line x1="22" y1="284" x2="22" y2="313" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><line x1="40" y1="332" x2="40" y2="361" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><text x="8" y="396" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--amber)" text-anchor="start" opacity="1">可见性：向父级注入服务；向下经 treeCommands；兄弟分支不直接互调。</text>
</svg>