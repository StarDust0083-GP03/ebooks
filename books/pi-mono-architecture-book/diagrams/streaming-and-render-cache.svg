<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 468" role="img" aria-labelledby="streaming-and-render-cache-title streaming-and-render-cache-desc" style="font-family:'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"><title id="streaming-and-render-cache-title">v1.5.0 至 v1.6.0 流式解析与 TUI 只读渲染缓存链路</title><desc id="streaming-and-render-cache-desc">大型工具调用经 StreamingJsonParser 增量解析并按帧合并更新；TUI Container 对未变子树返回同一只读数组引用，避免长会话滚动逐层拷贝。</desc><defs><marker id="streaming-and-render-cache-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--brand, #1B365D)"/></marker></defs><rect width="960" height="468" rx="6" fill="var(--paper, #faf9f5)"/><rect x="32" y="34" width="896" height="162" rx="8" fill="var(--paper-2, #f4f1e8)" fill-opacity="0.45" stroke="var(--line, #c4bfb0)" stroke-dasharray="6 5" stroke-width="1.5"/><text x="48" y="60" font-size="16" font-weight="500" fill="var(--muted, #5e5d57)">流式工具参数解析链路（packages/ai + coding-agent，v1.5.0）</text><rect x="32" y="242" width="896" height="162" rx="8" fill="var(--paper-2, #f4f1e8)" fill-opacity="0.45" stroke="var(--line, #c4bfb0)" stroke-dasharray="6 5" stroke-width="1.5"/><text x="48" y="268" font-size="16" font-weight="500" fill="var(--muted, #5e5d57)">TUI 只读渲染与祖先缓存链路（packages/tui，v1.6.0）</text><path d="M306 129 H351" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#streaming-and-render-cache-arrow)"/><path d="M609 129 H654" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#streaming-and-render-cache-arrow)"/><path d="M783 172 V216 Q783 224 775 224 H185 Q177 224 177 232 V294" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#streaming-and-render-cache-arrow)"/><path d="M306 337 H351" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#streaming-and-render-cache-arrow)"/><path d="M609 337 H654" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#streaming-and-render-cache-arrow)"/><rect x="48" y="86" width="258" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="177.0" y="120" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">Provider Delta 流</text><text x="177.0" y="157" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">增量到达的参数片段</text><rect x="351" y="86" width="258" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="480.0" y="120" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">StreamingJsonParser</text><text x="480.0" y="157" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">线性 append 与拷贝信用</text><rect x="654" y="86" width="258" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="783.0" y="120" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">ToolExecutionComponent</text><text x="783.0" y="157" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">argsPending 按帧合并渲染</text><rect x="48" y="294" width="258" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="177.0" y="328" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">子组件 render(width)</text><text x="177.0" y="365" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">返回 readonly string[]</text><rect x="351" y="294" width="258" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="480.0" y="328" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">renderChildLines()</text><text x="480.0" y="365" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">比对宽度、子引用与行内容</text><rect x="654" y="294" width="258" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="783.0" y="328" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">Container 缓存复用</text><text x="783.0" y="365" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">未变返回原引用；改动前先拷贝</text><text x="40" y="442" font-size="16" fill="var(--muted, #5e5d57)">流式解析消除 O(N^2) 重解析；Container 引用复用避免长会话全屏滚动打满单核 CPU。</text></svg>