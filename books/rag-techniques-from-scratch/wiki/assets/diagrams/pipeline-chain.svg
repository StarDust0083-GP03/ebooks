<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 226" width="540" height="226" role="img" aria-label="写入链与查询链的职责边界">
<title>写入链与查询链的职责边界</title>
<defs><marker id="arr-pipeline-chain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--muted)"/></marker></defs>
<text x="10" y="14" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--forest)" text-anchor="start">写入链（离线构建与原子发布）</text><rect x="10" y="22" width="118" height="54" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="20" y="39" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">原文与版本</text><text x="20" y="55" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">PDF / CSV / JSON</text><text x="20" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">doc_id + version</text><line x1="128" y1="49" x2="144" y2="49" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-pipeline-chain)"/><rect x="144" y="22" width="122" height="54" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="154" y="39" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">解析与切分</text><text x="154" y="55" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">OCR 4.1 块结构</text><text x="154" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">保留来源定位</text><line x1="266" y1="49" x2="282" y2="49" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-pipeline-chain)"/><rect x="282" y="22" width="116" height="54" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="292" y="39" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">多表示索引</text><text x="292" y="55" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">倒排 / 向量</text><text x="292" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">代理问题与摘要</text><line x1="398" y1="49" x2="414" y2="49" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-pipeline-chain)"/><rect x="414" y="22" width="116" height="54" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="424" y="39" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">完整快照发布</text><text x="424" y="55" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">校验后再切指针</text><text x="424" y="69" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">旧快照随时回退</text><line x1="10" y1="92" x2="530" y2="92" stroke="var(--line)" stroke-width="0.7" stroke-dasharray="3 3"/><line x1="472" y1="76" x2="472" y2="112" stroke="var(--muted)" stroke-width="1.15" stroke-dasharray="4 3" marker-end="url(#arr-pipeline-chain)"/><text x="466" y="106" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="var(--muted)" text-anchor="end">只读固定快照</text><text x="10" y="108" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="var(--amber)" text-anchor="start">查询链（先授权，再召回，只交付注入证据）</text><rect x="10" y="116" width="118" height="60" rx="3" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.4"/><text x="20" y="133" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">1. 权限与视图</text><text x="20" y="149" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">服务端会话身份</text><text x="20" y="163" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">active + scope</text><line x1="128" y1="146" x2="144" y2="146" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-pipeline-chain)"/><rect x="144" y="116" width="122" height="60" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="154" y="133" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">2. 召回与融合</text><text x="154" y="149" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">BM25 + 向量</text><text x="154" y="163" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">按 ID 对齐 RRF</text><line x1="266" y1="146" x2="282" y2="146" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-pipeline-chain)"/><rect x="282" y="116" width="116" height="60" rx="3" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="292" y="133" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">3. 扩展与打包</text><text x="292" y="149" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">同文档同版邻块</text><text x="292" y="163" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">按预算计入标签</text><line x1="398" y1="146" x2="414" y2="146" stroke="var(--muted)" stroke-width="1.15" marker-end="url(#arr-pipeline-chain)"/><rect x="414" y="116" width="116" height="60" rx="3" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.4"/><text x="424" y="133" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="start">4. 回答与引用</text><text x="424" y="149" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">仅引用 injected</text><text x="424" y="163" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--muted)" text-anchor="start">证据不足即拒答</text><text x="10" y="198" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="var(--amber)" text-anchor="start">红琥珀框为访问边界：未授权与废弃版本必须在计分前剔除，不能交给模型兜底。</text><text x="10" y="214" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="var(--muted)" text-anchor="start">日志同步记录 retrieved 与 injected 两组 ID，用来区分漏召回与预算截断。</text>
</svg>