r(--line)" stroke-width="0.6"/><text x="12" y="218" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="var(--ink)" text-anchor="start">专家工作区</text><text x="116" y="218" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.3" font-weight="400" fill="var(--muted)" text-anchor="start">本机目录（默认）</text><text x="266" y="218" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.3" font-weight="400" fill="var(--muted)" text-anchor="start">S3 / COS / TOS / PG / Sandbox</text><line x1="8" y1="228" x2="412" y2="228" stroke="var(--line)" stroke-width="0.6"/><text x="8" y="250" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--muted)" text-anchor="start">v1.0.3b5 起下线 history_v2，启动时由 retire_v2.py 单次迁回 thread_messages。</text><text x="8" y="265" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="var(--amber)" text-anchor="start">v1.0.3b7 修复：gc_orphan_checkpoints 对 PG 永远只统计，绝不删其他智能体对话。</text>
