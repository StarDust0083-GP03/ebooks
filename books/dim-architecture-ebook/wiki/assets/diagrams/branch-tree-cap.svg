<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 328" width="420" height="328" role="img" aria-label="分支时间线、保护路径配额与三键状态">
<title>分支时间线、保护路径配额与三键状态</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<text x="8" y="12" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--muted)" text-anchor="start" opacity="1">起点 main 恒可开线；默认分支沿 branch/default 移动并保护其祖先链</text><rect x="128" y="24" width="164" height="42" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="136" y="39.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.3" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">main（起点 / Root）</text><text x="136" y="53.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">恒可开工具线 · 永不结束</text><line x1="175" y1="66" x2="92" y2="92" stroke="var(--forest)" stroke-width="1.05" marker-end="url(#arrow)"/><line x1="210" y1="66" x2="210" y2="92" stroke="var(--muted)" stroke-width="1.05" marker-end="url(#arrow)"/><line x1="245" y1="66" x2="336" y2="92" stroke="var(--muted)" stroke-width="1.05" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="8" y="92" width="140" height="48" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="16" y="107.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.0" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">分支 A（工具线）</text><text x="16" y="121.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">受保护祖先链</text><text x="16" y="133.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">不计入配额 · 禁止 end</text><rect x="156" y="92" width="114" height="48" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="164" y="107.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.0" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">分支 C（工具线）</text><text x="164" y="121.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">非保护路径</text><text x="164" y="133.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">占 1 个工具线名额</text><rect x="278" y="92" width="134" height="48" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="286" y="107.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.0" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">插件线（Goal 评估）</text><text x="286" y="121.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">source=host</text><text x="286" y="133.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">不可选主线 · 不占名额</text><line x1="78" y1="140" x2="78" y2="166" stroke="var(--forest)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="8" y="166" width="176" height="50" rx="2.5" fill="var(--paper-2)" stroke="var(--forest)" stroke-width="1.3"/><text x="16" y="181.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.0" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">分支 B（当前默认分支）</text><text x="16" y="195.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">可开工具线 · 省略 branchId 路由至此</text><text x="16" y="207.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">切回 main 后 A 与 B 一起恢复计额</text><line x1="184" y1="191" x2="224" y2="191" stroke="var(--amber)" stroke-width="1.05" marker-end="url(#arrow)"/><rect x="224" y="166" width="188" height="50" rx="2.5" fill="var(--paper-2)" stroke="var(--amber)" stroke-width="1.3"/><text x="232" y="181.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="9.0" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">分支 D（B 开的工具线）</text><text x="232" y="195.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">新开子线不在保护链上</text><text x="232" y="207.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">预留时在树锁内扣 1 个配额</text><line x1="8" y1="230" x2="412" y2="230" stroke="var(--line)" stroke-width="0.7" stroke-dasharray="3 3"/><text x="8" y="245" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">三条独立键控状态块（压缩后各自独立重放，互不覆盖）</text><rect x="8" y="254" width="128" height="46" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="16" y="269.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">branch:line</text><text x="16" y="283.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">本线身份与主线状态</text><text x="16" y="295.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">切换默认分支时重申</text><rect x="146" y="254" width="128" height="46" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="154" y="269.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">branch:roster</text><text x="154" y="283.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">本线开启的活跃工具线</text><text x="154" y="295.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">子线继承时自动退役</text><rect x="284" y="254" width="128" height="46" rx="2.5" fill="var(--paper-2)" stroke="var(--line)" stroke-width="0.85"/><text x="292" y="269.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="var(--ink)" text-anchor="start" opacity="1">branch:parent</text><text x="292" y="283.0" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">父线最新 head 与读游标</text><text x="292" y="295.5" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="var(--muted)" text-anchor="start" opacity="1">只传位置不传父线正文</text><text x="8" y="316" font-family="'IBM Plex Sans','Noto Sans CJK SC',system-ui,sans-serif" font-size="8.1" font-weight="400" fill="var(--amber)" text-anchor="start" opacity="1">默认上限 DEFAULT_MAX_OPEN_LINES = 4；权威事实 branch/default 只写在 main 上。</text>
</svg>