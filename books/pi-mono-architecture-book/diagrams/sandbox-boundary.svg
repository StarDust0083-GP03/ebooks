<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="sandbox-boundary-title sandbox-boundary-desc" style="font-family:'Noto Sans CJK SC',system-ui,-apple-system,sans-serif"><title id="sandbox-boundary-title">脚本如何跨过宿主桥</title><desc id="sandbox-boundary-desc">脚本在 worker 的 QuickJS/WASM 中运行，工具调用经消息桥回到主线程，再走参数校验与扩展钩子。</desc><defs><marker id="sandbox-boundary-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--brand, #1B365D)"/></marker></defs><rect width="960" height="470" rx="6" fill="var(--paper, #faf9f5)"/><rect x="36" y="40" width="300" height="376" rx="8" fill="var(--paper-2, #f4f1e8)" fill-opacity="0.45" stroke="var(--line, #c4bfb0)" stroke-dasharray="6 5" stroke-width="1.5"/><text x="52" y="66" font-size="16" font-weight="500" fill="var(--muted, #5e5d57)">Pi 主线程</text><rect x="368" y="40" width="566" height="376" rx="8" fill="var(--paper-2, #f4f1e8)" fill-opacity="0.45" stroke="var(--line, #c4bfb0)" stroke-dasharray="6 5" stroke-width="1.5"/><text x="384" y="66" font-size="16" font-weight="500" fill="var(--muted, #5e5d57)">worker 与独立 VM</text><path d="M672 145 H608" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#sandbox-boundary-arrow)"/><path d="M392 145 H308" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#sandbox-boundary-arrow)"/><path d="M186 188 V296" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#sandbox-boundary-arrow)"/><path d="M794 188 V296" fill="none" stroke="var(--brand, #1B365D)" stroke-width="2" marker-end="url(#sandbox-boundary-arrow)"/><rect x="64" y="102" width="244" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="186.0" y="136" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">工具适配器</text><text x="186.0" y="173" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">ctx.executeTool</text><rect x="64" y="296" width="244" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="186.0" y="330" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">校验与扩展钩子</text><text x="186.0" y="367" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">pi-schema 与真实工具</text><rect x="392" y="102" width="216" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="500.0" y="136" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">worker 消息桥</text><text x="500.0" y="173" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">JSON 请求与结果</text><rect x="672" y="102" width="244" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="794.0" y="136" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">QuickJS / WASM</text><text x="794.0" y="173" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">脚本、prelude、受限全局</text><rect x="672" y="296" width="244" height="86" rx="6" fill="var(--paper-2, #f4f1e8)" stroke="var(--brand, #1B365D)" stroke-width="1.5"/><text x="794.0" y="330" text-anchor="middle" font-size="19" font-weight="500" fill="var(--ink, #20201d)">脚本输出</text><text x="794.0" y="367" text-anchor="middle" font-size="14" fill="var(--muted, #5e5d57)">text / image / return</text><text x="40" y="444" font-size="16" fill="var(--muted, #5e5d57)">VM 没有文件系统与网络权限，但注入的 bash 依然继承宿主进程权限。</text></svg>